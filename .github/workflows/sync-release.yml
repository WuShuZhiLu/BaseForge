# 发布资产同步（GitHub → Gitea / Gitee）
#
# 背景：Windows / macOS / iOS 的构建需要 GitHub 托管 runner（Windows Server、Apple 硬件），
# Gitea 的 act_runner 只有 Linux 容器模型，做不到。因此发布链路是：
#   Gitea 打 tag（主仓） → push mirror → GitHub/Gitee 收到 tag
#   GitHub Actions 构建 win/mac/ios → 发到 GitHub Release
#   本 workflow（在 Gitea 上跑）把 GitHub Release 资产搬到 Gitea 与 Gitee
#
# 为什么搬运单独成一个 workflow：
#   - 构建（几分钟到几十分钟）与搬运（几十秒）解耦，搬运失败可直接重跑，不重建；
#   - 凭据只出现在这里（GitHub token 只读 + Gitea/Gitee token 只写本仓 Release）。

name: Sync Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要同步的 tag；留空 = 自动取最近一个 tag"
        required: false
        default: ""
      targets:
        description: "目标平台，逗号分隔"
        required: false
        default: "gitea,gitee"
      dry_run:
        description: "只演练不上传（true/false）"
        required: false
        default: "false"
  # GitHub 的 release 事件到不了 Gitea，所以不设 release 触发；
  # 需要自动化时可在 Gitea 侧加定时任务，或由发布脚本在构建完成后调用本 workflow。

permissions:
  contents: read

concurrency:
  group: sync-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    name: sync assets
    runs-on: ubuntu-latest
    container: node:22-bookworm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync release assets
        # 所有凭据都来自仓库 Secrets，绝不写入脚本或 workflow 明文；
        # 也不要打开 bash -x（会把 Authorization 头打进日志）。
        env:
          GITHUB_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GITHUB_REPO: ${{ vars.GH_MIRROR_REPO }}
          GITEA_URL: ${{ github.server_url }}
          GITEA_TOKEN: ${{ secrets.RELEASE_SYNC_TOKEN }}
          GITEA_REPO: ${{ github.repository }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
          TARGETS: ${{ github.event.inputs.targets }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=(--targets "${TARGETS:-gitea,gitee}")
          if [ -n "${RELEASE_TAG:-}" ]; then ARGS+=(--tag "${RELEASE_TAG}"); fi
          if [ "${DRY_RUN:-false}" = "true" ]; then ARGS+=(--dry-run); fi
          node scripts/sync-release-assets.mjs "${ARGS[@]}"
