# 推送 v* tag 后创建/更新 Gitea Release 草稿：
# 正文直接取 CHANGELOG.md 里对应版本的段落（## vX.Y.Z - 日期 到下一个 ## 之前）。
# 草稿只做「记录 + 正文」，资产同步与转正式由 Sync Release Assets 在发布门禁里完成。
# 认证优先用 secrets.RELEASE_TOKEN（仓库 PAT，需要 repo 写权限）；
# 未配置时退回 Actions 内置 token（GITHUB_TOKEN）。

name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: publish release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      BUILTIN_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INPUT_TAG: ${{ github.event.inputs.tag }}
      REF_NAME: ${{ github.ref_name }}
      SERVER_URL: ${{ github.server_url }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create or update release
        shell: bash
        run: |
          set -eu

          tag="${INPUT_TAG:-$REF_NAME}"
          ver="${tag#v}"
          case "$ver" in
            [0-9]*) ;;
            *) echo "::error::tag 名不合法：${tag}"; exit 1 ;;
          esac

          if [ ! -f CHANGELOG.md ]; then
            echo "::error::工作区里没有 CHANGELOG.md"
            exit 1
          fi

          # 取该版本段落：从 "## vX.Y.Z" 到下一个 "## " 之前
          section="$(awk -v head="## v${ver}" '
            $0 == head || index($0, head " ") == 1 { flag = 1; next }
            flag && /^## / { exit }
            flag { print }
          ' CHANGELOG.md)"
          if [ -z "$section" ]; then
            echo "::error::CHANGELOG.md 里没有 ## v${ver} 段落，先更新 CHANGELOG 再发版"
            exit 1
          fi

          token="${RELEASE_TOKEN:-}"
          [ -n "$token" ] || token="${BUILTIN_TOKEN:-}"
          if [ -z "$token" ]; then
            echo "::error::没有可用 token：请配置 secrets.RELEASE_TOKEN（repo 写权限）"
            exit 1
          fi

          api="${SERVER_URL%/}/api/v1/repos/${REPO}"
          # 单行 python3 组 JSON，避免 YAML block scalar 里嵌入 heredoc 的缩进问题。
          # 新建时固定 draft=true；更新时去掉 draft 字段，避免把已转正的 Release 改回草稿。
          VER="$ver" SECTION="$section" python3 -c 'import json,os;v=os.environ["VER"];print(json.dumps({"tag_name":"v"+v,"name":"v"+v,"body":os.environ["SECTION"],"draft":True,"prerelease":"-" in v},ensure_ascii=False))' > /tmp/release.json
          python3 -c 'import json;d=json.load(open("/tmp/release.json"));d.pop("draft",None);json.dump(d,open("/tmp/release-update.json","w"),ensure_ascii=False)'

          status="$(curl -sS -o /tmp/existing.json -w '%{http_code}' \
            -H "Authorization: token ${token}" "${api}/releases/tags/v${ver}")"

          if [ "$status" = "200" ]; then
            id="$(python3 -c 'import json; print(json.load(open("/tmp/existing.json"))["id"])')"
            echo "更新已有 Release #${id}（${tag}）"
            status="$(curl -sS -o /tmp/response.json -w '%{http_code}' -X PATCH \
              -H "Authorization: token ${token}" -H 'Content-Type: application/json' \
              --data @/tmp/release-update.json "${api}/releases/${id}")"
          else
            echo "创建新 Release（${tag}）"
            status="$(curl -sS -o /tmp/response.json -w '%{http_code}' -X POST \
              -H "Authorization: token ${token}" -H 'Content-Type: application/json' \
              --data @/tmp/release.json "${api}/releases")"
          fi

          case "$status" in
            2*) ;;
            *)
              echo "::error::Gitea API 返回 ${status}"
              cat /tmp/response.json || true
              exit 1
              ;;
          esac

          python3 -c 'import json; d=json.load(open("/tmp/response.json")); print("Release 地址：", d.get("html_url", d.get("tag_name")))'
