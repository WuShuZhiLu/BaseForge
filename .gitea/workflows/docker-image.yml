# 版本号取 CHANGELOG.md 最新已发布版本（## vX.Y.Z - 日期）：镜像 tag 同样带 v。
# tag 触发时校验 tag 与 CHANGELOG 一致，避免镜像版本和更新日志脱节。
# tag 触发同时推送 vX.Y.Z 与 latest：镜像不参与桌面端发布门禁，tag 即代表已发布。
# latest_only 模式保留为手动补救：只把 latest 指向已存在的版本镜像，不重新构建。
# 仓库地址与凭据全部来自仓库变量/密钥，代码里不写死任何地址：
# 未配置任何仓库时只构建、不推送。
# 配置项（逗号分隔、按序号对应，免登录写 anon）：vars.IMAGE_REPOSITORIES /
# vars.REGISTRY_USERS / secrets.REGISTRY_TOKENS；明细与内网 registry 前置条件见 docs/release-pipeline.md。

name: Build Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push_image:
        description: '是否推送到镜像仓库（false = 只构建）'
        required: false
        default: 'true'
      latest_only:
        description: '只把 latest 指向已存在的版本镜像（发布门禁通过后使用，不重新构建）'
        required: false
        default: 'false'
      tag:
        description: 'latest_only 模式下要指向的版本 tag（如 v1.2.3）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build docker image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE_REPOSITORIES: ${{ vars.IMAGE_REPOSITORIES }}
      REGISTRY_USERS: ${{ vars.REGISTRY_USERS }}
      REGISTRY_TOKENS: ${{ secrets.REGISTRY_TOKENS }}
      # 任意一个仓库推送失败是否让 job 失败（默认 true）
      IMAGE_PUSH_REQUIRE_ALL: ${{ vars.IMAGE_PUSH_REQUIRE_ALL }}
      # 旧变量，仅在没有配置上面的列表时生效
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      INPUT_PUSH: ${{ github.event.inputs.push_image }}
      INPUT_LATEST_ONLY: ${{ github.event.inputs.latest_only }}
      INPUT_TAG: ${{ github.event.inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve npm source (cn mirror by default)
        # Gitea runner 在国内，默认切国内镜像；GitHub 侧走官方源。
        # 脚本是唯一真相：镜像地址和 replace-registry-host 都在 scripts/npm-sources.mjs。
        shell: bash
        run: |
          set -eu
          eval "$(node scripts/npm-source.mjs env "${NPM_SOURCE_PROFILE:-cn}" --export)"
          echo "NPM_REGISTRY=${npm_config_registry}" >> "$GITHUB_ENV"
          echo "npm registry: ${npm_config_registry}"

      - name: Build image
        # 脚本用了函数与 local 等 bash 特性，显式指定以免落回 sh
        shell: bash
        run: |
          set -eu

          # ---- 列表 / 仓库解析辅助函数（bash 要求先定义后使用） ----
          # 取仓库地址里的 registry host；输出为空表示 Docker Hub
          registry_host() {
            local host
            host=$(printf '%s' "$1" | cut -d/ -f1)
            case "$host" in
              *.*|*:*|localhost) printf '%s' "$host" ;;
              *) printf '' ;;
            esac
          }

          # 按序号取逗号列表里的第 N 项（1 起）；越界或空项返回空字符串
          list_item() {
            [ -n "$1" ] || return 0
            printf '%s\n' "$1" | tr ',' '\n' | sed -n "${2}p" \
              | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'
          }

          # 逗号列表的项数（保留空项，用于校验与仓库是否一一对应）
          count_items() {
            [ -n "$1" ] || { printf '0'; return 0; }
            printf '%s\n' "$1" | tr ',' '\n' | wc -l | tr -d ' '
          }

          # 免登录统一写 anon（大小写不敏感）；缺项或留空同样按 anon 处理
          is_anon_marker() {
            case "$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')" in
              ''|anon) return 0 ;;
              *) return 1 ;;
            esac
          }

          # 宿主 daemon 是否已把该 host 列为不受信任（HTTP）registry；
          # daemon 不可达时不做判断（返回 0），避免每个仓库都刷一条误报。
          registry_is_insecure() {
            [ -n "$1" ] || return 1
            local info
            info="$(docker info 2>/dev/null || true)"
            [ -n "$info" ] || return 0
            printf '%s\n' "$info" \
              | sed -n '/Insecure Registries:/,/^[[:space:]]*$/p' \
              | grep -Fq -- "$1"
          }

          if [ ! -f package.json ] || [ ! -f Dockerfile ]; then
            echo "::error::工作区里没有 package.json / Dockerfile，checkout 未生效"
            exit 1
          fi

          # latest_only：手动补救，把 latest 指向已经推送好的版本镜像，不重新构建。
          # 常规 tag 触发：构建并同时推送 vX.Y.Z 与 latest（先版本，成功后才动 latest）。
          LATEST_ONLY="${INPUT_LATEST_ONLY:-false}"
          if [ "$LATEST_ONLY" = "true" ]; then
            VER="${INPUT_TAG#v}"
            VER="${VER#v}"
            if [ -z "$VER" ]; then
              echo "::error::latest_only 模式需要 inputs.tag（如 v1.2.3）"
              exit 1
            fi
            TAG="v${VER}"
            BUILD_REF=""
            echo "latest_only：不重新构建，只把 latest 指向 ${TAG}"
          else
            # 版本号以 CHANGELOG.md 的最新已发布版本为准（标题形如 "## v0.1.0 - 2026-11-05"）；
            # 本次是 tag 触发时，tag 必须与之一致，避免镜像版本和更新日志脱节。
            REF_TAG=""
            case "${GITHUB_REF:-}" in
              refs/tags/*) REF_TAG="${GITHUB_REF#refs/tags/}" ;;
            esac
            if [ -z "$REF_TAG" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
              REF_TAG="${GITHUB_REF_NAME:-}"
            fi
            REF_TAG="${REF_TAG#v}"

            CL_VERSION="$(sed -n 's/^## v\([0-9][0-9A-Za-z.+-]*\).*/\1/p' CHANGELOG.md 2>/dev/null | head -n 1)"
            if [ -n "$CL_VERSION" ]; then
              if [ -n "$REF_TAG" ] && [ "$REF_TAG" != "$CL_VERSION" ]; then
                echo "::error::tag v${REF_TAG} 与 CHANGELOG 最新版本 v${CL_VERSION} 不一致：先更新 CHANGELOG 再打 tag"
                exit 1
              fi
              VER="$CL_VERSION"
              echo "版本号取自 CHANGELOG.md：v${VER}"
            else
              VER="$REF_TAG"
              if [ -z "$VER" ]; then
                VER="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1)"
              fi
              if [ -z "$VER" ]; then
                echo "::error::推导不出版本号（CHANGELOG / tag 名 / package.json 都拿不到）"
                exit 1
              fi
              echo "::warning::CHANGELOG.md 里没有已发布版本段，回退用 v${VER}"
            fi
            TAG="v${VER}"

            # 本地构建用固定 tag，推送时再 retag 到具体仓库，避免依赖仓库地址
            BUILD_REF="baseforge-build:${TAG}"
            docker build -f Dockerfile -t "$BUILD_REF" \
              --build-arg APP_VERSION="$VER" \
              --build-arg NPM_REGISTRY="${NPM_REGISTRY:-https://registry.npmjs.org/}" \
              --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --build-arg VCS_REF="${GITHUB_SHA:-}" .
          fi

          if [ "${INPUT_PUSH:-true}" != "true" ]; then
            echo "push_image=false，只构建不推送"
            exit 0
          fi

          REPOS_RAW="${IMAGE_REPOSITORIES:-}"
          if [ -z "$REPOS_RAW" ]; then
            # 兼容旧配置：由 IMAGE_REGISTRY / IMAGE_NAMESPACE / IMAGE_NAME 拼一个仓库
            NAMESPACE="${IMAGE_NAMESPACE:-}"
            NAMESPACE="${NAMESPACE#/}"
            NAMESPACE="${NAMESPACE%/}"
            NAME="${IMAGE_NAME:-baseforge}"
            if [ -n "$NAMESPACE" ]; then
              NAME="${NAMESPACE}/${NAME}"
            fi
            REGISTRY="${IMAGE_REGISTRY:-}"
            REGISTRY="${REGISTRY#http://}"
            REGISTRY="${REGISTRY#https://}"
            REGISTRY="${REGISTRY%/}"
            if [ -n "$REGISTRY" ]; then
              REPOS_RAW="${REGISTRY}/${NAME}"
            fi
          fi
          if [ -z "$REPOS_RAW" ]; then
            echo "未配置 vars.IMAGE_REPOSITORIES，只构建不推送"
            exit 0
          fi

          echo "候选仓库："
          printf '%s\n' "$REPOS_RAW" | tr ',;' '\n' | sed '/^[[:space:]]*$/d' | sed 's/^[[:space:]]*/  - /'

          # 末尾无换行时 printf '%s' 会让 wc -l 少算一行，这里统一带换行
          repo_count=$(printf '%s\n' "$REPOS_RAW" | tr ',;' '\n' | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')
          user_count=$(count_items "${REGISTRY_USERS:-}")
          token_count=$(count_items "${REGISTRY_TOKENS:-}")
          echo "仓库 ${repo_count} 个，账号 ${user_count} 项，密钥 ${token_count} 项"
          if [ "$user_count" -ne 0 ] && [ "$user_count" -ne "$repo_count" ]; then
            echo "::warning::REGISTRY_USERS 有 ${user_count} 项，与仓库数 ${repo_count} 不一致；缺的仓库按 anon 处理，请核对顺序"
          fi
          if [ "$token_count" -ne 0 ] && [ "$token_count" -ne "$repo_count" ]; then
            echo "::warning::REGISTRY_TOKENS 有 ${token_count} 项，与仓库数 ${repo_count} 不一致，请核对顺序"
          fi

          # 大层上传到公网仓库时经常被中途 reset，Docker 自带的 blob 级重试
          # 只在几十秒内放弃；这里按整次 push 重试，已上传成功的层会由 registry
          # 判定 "Layer already exists" 直接跳过，所以重试成本很低。
          push_with_retry() {
            local ref="$1" attempt=1 max_attempts=4 delay=15 rc
            while [ "$attempt" -le "$max_attempts" ]; do
              echo "推送 ${ref}（第 ${attempt}/${max_attempts} 次）"
              rc=0
              # 单次 push 最长 20 分钟；同时落一份日志，用来区分“网络抖动”和“权限拒绝”
              timeout 1200 docker push "$ref" 2>&1 | tee "$PUSH_LOG"
              rc=${PIPESTATUS[0]}
              if [ "$rc" -eq 0 ]; then
                return 0
              fi
              # 认证 / 权限 / 名字非法：重试结果一样，直接失败，不白等 105 秒和 20 分钟超时
              if grep -Eqi 'denied|unauthorized|no basic auth|invalid username|invalid reference|repository does not exist' "$PUSH_LOG"; then
                echo "::warning::${ref} 被拒绝（认证或权限问题），不重试"
                return 1
              fi
              if [ "$attempt" -eq "$max_attempts" ]; then
                echo "::warning::推送 ${ref} 连续失败 ${max_attempts} 次"
                echo "--- 最后一次 push 日志（尾部 20 行）---"
                tail -n 20 "$PUSH_LOG" || true
                echo "--- 各层体积（定位是哪一层过大导致上传失败）---"
                docker history --no-trunc --format '{{.Size}}  {{.CreatedBy}}' "$ref" | head -n 20 || true
                return 1
              fi
              echo "第 ${attempt} 次推送失败，${delay} 秒后重试（已成功的层会自动跳过）"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          # push 退出码为 0 不等于远端一定能拉到；这里回查一次 manifest。
          # HTTP registry 需要 --insecure，否则 CLI 直连会报 x509/https 错误。
          verify_pushed() {
            local ref="$1" scheme="${2:-https}" interval=2
            while [ "$interval" -le 10 ]; do
              if [ "$scheme" = "http" ] && timeout 60 docker manifest inspect --insecure "$ref" >/dev/null 2>&1; then
                echo "远端确认存在：${ref}"
                return 0
              fi
              if timeout 60 docker manifest inspect "$ref" >/dev/null 2>&1; then
                echo "远端确认存在：${ref}"
                return 0
              fi
              sleep "$interval"
              interval=$((interval + 2))
            done
            echo "::warning::无法在 registry 回查到 ${ref}，请确认仓库路径与账号权限"
          }

          pushed_list=""
          failed_list=""
          logged_hosts=""
          index=0

          # 仓库列表先落到临时文件：heredoc / 管道在 YAML block scalar 里
          # 顶格内容会提前结束 scalar，写成文件既安全又能让循环里修改计数器生效。
          REPO_LIST_FILE="$(mktemp)"
          PUSH_LOG="$(mktemp)"
          trap 'rm -f "$REPO_LIST_FILE" "$PUSH_LOG"' EXIT
          printf '%s\n' "$REPOS_RAW" | tr ',;' '\n' > "$REPO_LIST_FILE"

          while IFS= read -r raw_repo; do
            repo=$(printf '%s' "$raw_repo" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            [ -n "$repo" ] || continue
            index=$((index + 1))

            scheme="https"
            case "$repo" in
              http://*) scheme="http"; repo="${repo#http://}" ;;
              https://*) scheme="https"; repo="${repo#https://}" ;;
            esac
            repo="${repo%/}"
            [ -n "$repo" ] || continue

            # 先体检一次名字，避免 docker tag 报一堆难懂的错：仓库名必须全小写，
            # 只允许 小写字母数字 . _ - / : ，而且不能带 tag（tag 由脚本拼）
            if printf '%s' "$repo" | grep -Eqv '^[a-z0-9]+([._/-][a-z0-9]+)*(:[0-9]+)?/[a-z0-9]+([._/-][a-z0-9]+)*$'; then
              echo "::warning::仓库地址格式不合法（需全小写、不含 tag）：${repo}"
              failed_list="${failed_list} ${repo}"
              continue
            fi

            ref="${repo}:${TAG}"
            latest_ref="${repo}:latest"
            host=$(registry_host "$repo")

            user=$(list_item "${REGISTRY_USERS:-}" "$index")
            token=$(list_item "${REGISTRY_TOKENS:-}" "$index")
            # 没配列表时回退到旧的单值凭据
            if [ -z "${REGISTRY_USERS:-}" ] && [ -z "${REGISTRY_TOKENS:-}" ]; then
              user="${REGISTRY_USER:-}"
              token="${REGISTRY_TOKEN:-}"
            fi
            # 用户名写 anon 表示该仓库免登录；缺项或留空也按 anon 处理
            if is_anon_marker "$user"; then
              if [ -n "$token" ] && ! is_anon_marker "$token"; then
                echo "::warning::仓库 ${index}（${repo}）的用户名是 anon，配的密钥会被忽略"
              fi
              user=""
              token=""
            elif is_anon_marker "$token"; then
              if [ -n "$user" ]; then
                echo "::warning::仓库 ${index}（${repo}）的用户名是 ${user}，但密钥也写成了 anon，将按匿名推送"
              fi
              token=""
            fi

            # 日志里的凭据描述要和实际行为一致：有账号无密钥时会在推送时按匿名处理
            if [ -n "$user" ] && [ -n "$token" ]; then
              cred_desc="$user"
            elif [ -n "$user" ]; then
              cred_desc="${user}（缺密钥，按匿名）"
            else
              cred_desc="匿名"
            fi
            echo "==> 仓库 ${index}：${repo}（host：${host:-docker.io}，账号：${cred_desc}）"
            if [ "$scheme" = "http" ] && ! registry_is_insecure "$host"; then
              echo "::warning::${host} 不在宿主 daemon 的 insecure-registries 里，HTTP 推送会 404/拒绝；在 daemon.json 加 \"insecure-registries\": [\"${host}\"] 后 systemctl restart docker"
            fi
            if [ -n "$user" ] && [ -n "$token" ]; then
              if [ -n "$host" ]; then
                echo "登录 ${host}（账号 ${user}）"
                if ! echo "$token" | docker login "$host" -u "$user" --password-stdin; then
                  echo "::warning::登录 ${host} 失败，跳过 ${repo}"
                  failed_list="${failed_list} ${repo}"
                  continue
                fi
              else
                echo "登录 Docker Hub（账号 ${user}）"
                if ! echo "$token" | docker login -u "$user" --password-stdin; then
                  echo "::warning::登录 Docker Hub 失败，跳过 ${repo}"
                  failed_list="${failed_list} ${repo}"
                  continue
                fi
              fi
              logged_hosts="${logged_hosts} ${host:-docker.io}"
            else
              echo "该仓库未提供账号密码，按匿名推送"
            fi

            if [ "$LATEST_ONLY" = "true" ]; then
              # 发布门禁：版本镜像已经推送过，这里只把 latest 指向它，不重复构建/推版本 tag
              echo "拉取 ${ref} 并把 latest 指向它"
              if ! docker pull "$ref"; then
                echo "::warning::拉取 ${ref} 失败，跳过 ${repo}"
                failed_list="${failed_list} ${repo}"
                continue
              fi
              if ! docker tag "$ref" "$latest_ref"; then
                echo "::warning::latest 打标失败，跳过 ${repo}"
                failed_list="${failed_list} ${repo}"
                continue
              fi
              if push_with_retry "$latest_ref"; then
                verify_pushed "$latest_ref" "$scheme"
                pushed_list="${pushed_list} ${repo}"
              else
                failed_list="${failed_list} ${repo}"
              fi
            else
              # 版本 tag 与 latest 都要先在本地打上，push 只能推本地已存在的 tag
              if ! docker tag "$BUILD_REF" "$ref" || ! docker tag "$BUILD_REF" "$latest_ref"; then
                echo "::warning::打标失败，跳过 ${repo}"
                failed_list="${failed_list} ${repo}"
                continue
              fi
              # 先推版本 tag，成功后才移动 latest：latest 绝不能指向一个没推上去的版本
              echo "推送 ${ref}"
              if ! push_with_retry "$ref"; then
                failed_list="${failed_list} ${repo}"
                continue
              fi
              verify_pushed "$ref" "$scheme"
              echo "推送 ${latest_ref}"
              if push_with_retry "$latest_ref"; then
                verify_pushed "$latest_ref" "$scheme"
                pushed_list="${pushed_list} ${repo}"
              else
                failed_list="${failed_list} ${repo}"
              fi
            fi
          done < "$REPO_LIST_FILE"
          rm -f "$REPO_LIST_FILE"

          echo "推送成功：${pushed_list:-无}"
          echo "推送失败：${failed_list:-无}"

          # 推送结束立即注销，避免登录凭据留在 runner 的 ~/.docker/config.json
          for host in $logged_hosts; do
            docker logout "$host" >/dev/null 2>&1 || true
          done

          if [ -n "$failed_list" ]; then
            if [ "${IMAGE_PUSH_REQUIRE_ALL:-true}" = "true" ]; then
              echo "::error::有仓库推送失败：${failed_list}"
              exit 1
            fi
            echo "::warning::有仓库推送失败（IMAGE_PUSH_REQUIRE_ALL=false，继续）：${failed_list}"
          fi
