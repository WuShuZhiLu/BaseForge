# tag：push tag 取名字去掉 v，手动触发取 package.json 的 version；推送时同步 :latest。
# registry 与 namespace 都没配时只构建、不推送。

name: Build Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push_image:
        description: '是否推送到镜像仓库（false = 只构建）'
        required: false
        default: 'true'

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build docker image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY }}
      IMAGE_NAMESPACE: ${{ vars.IMAGE_NAMESPACE }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      INPUT_PUSH: ${{ github.event.inputs.push_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          set -eu

          if [ ! -f package.json ] || [ ! -f Dockerfile ]; then
            echo "::error::工作区里没有 package.json / Dockerfile，checkout 未生效"
            exit 1
          fi

          TAG=""
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME:-}"
            TAG="${TAG#v}"
          fi
          if [ -z "$TAG" ]; then
            TAG="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' package.json | head -n 1)"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::推导不出版本号（tag 名与 package.json 都拿不到）"
            exit 1
          fi

          NAME="${IMAGE_NAME:-baseforge}"
          if [ -n "${IMAGE_NAMESPACE:-}" ]; then
            NAME="${IMAGE_NAMESPACE}/${NAME}"
          fi
          if [ -n "${IMAGE_REGISTRY:-}" ]; then
            REF="${IMAGE_REGISTRY}/${NAME}:${TAG}"
          else
            REF="${NAME}:${TAG}"
          fi

          LATEST_REF="${REF%:*}:latest"
          echo "构建镜像：${REF}"
          docker build -f Dockerfile -t "$REF" \
            --build-arg APP_VERSION="$TAG" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg VCS_REF="${GITHUB_SHA:-}" .

          if [ "${INPUT_PUSH:-true}" != "true" ]; then
            echo "push_image=false，只构建不推送"
            exit 0
          fi
          if [ -z "${IMAGE_REGISTRY:-}" ] && [ -z "${IMAGE_NAMESPACE:-}" ]; then
            echo "未配置 vars.IMAGE_REGISTRY / vars.IMAGE_NAMESPACE，只构建不推送"
            exit 0
          fi

          if [ -n "${REGISTRY_USER:-}" ] && [ -n "${REGISTRY_TOKEN:-}" ]; then
            if [ -n "${IMAGE_REGISTRY:-}" ]; then
              echo "$REGISTRY_TOKEN" | docker login "$IMAGE_REGISTRY" -u "$REGISTRY_USER" --password-stdin
            else
              echo "$REGISTRY_TOKEN" | docker login -u "$REGISTRY_USER" --password-stdin
            fi
          fi

          docker push "$REF"
          if [ "$REF" != "$LATEST_REF" ]; then
            docker tag "$REF" "$LATEST_REF"
            docker push "$LATEST_REF"
          fi
