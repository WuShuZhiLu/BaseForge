<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>风格原型 · Confluence（空间+可编辑首页）</title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--border:#dfe1e6;--border-strong:#c8ccd4;--text:#172b4d;--text-2:#44546f;--text-3:#6b778c;--brand:#0052cc;--brand-soft:#deebff;--blue:#2684ff;--radius:6px;--radius-lg:10px;--shadow:0 1px 3px rgba(9,30,66,.12),0 6px 18px rgba(9,30,66,.12);font-size:15px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.topbar{height:46px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border)}
.logo{font-weight:700;font-size:14px;color:var(--brand)}
.urlbar{flex:1;max-width:620px;display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 14px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--text-2)}
.urlbar b{color:var(--brand);font-weight:600}
.hint{margin-left:auto;font-size:12px;color:var(--text-3)}
.layout{display:flex;height:calc(100vh - 46px)}
.sidebar{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
/* 空间目录 */
.dir-h{padding:14px 16px 8px}
.dir-h h3{font-size:14px}
.dir-h p{font-size:11.5px;color:var(--text-3);margin-top:3px}
.dir-search{margin:8px 12px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:7px 10px}
.dir-search input{border:none;outline:none;background:none;flex:1;font:inherit;color:var(--text);font-size:13px}
.sp-item{display:flex;align-items:center;gap:11px;padding:9px 14px;cursor:pointer}
.sp-item:hover{background:var(--bg)}
.sp-item .lg{width:32px;height:32px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.sp-item b{font-size:13.5px;display:block}
.sp-item .s{font-size:11px;color:var(--text-3)}
.sp-item .star{margin-left:auto;font-size:13px;color:var(--text-3);opacity:0}
.sp-item:hover .star{opacity:1}
.sp-item .star.on{opacity:1;color:var(--amber)}
/* 空间侧栏 */
.sp-head{padding:14px 14px 10px;border-bottom:1px solid var(--border)}
.sp-head .lg{width:40px;height:40px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.sp-head b{font-size:15px;display:block;margin-top:8px}
.sp-head .s{font-size:11.5px;color:var(--text-3)}
.sp-nav{padding:8px}
.sp-nav .nv{display:flex;align-items:center;gap:9px;height:32px;padding:0 10px;border-radius:var(--radius);font-size:13.5px;color:var(--text-2);cursor:pointer}
.sp-nav .nv:hover{background:var(--bg)}
.sp-nav .nv.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.sp-nav .nv .n{margin-left:auto;font-size:11px;color:var(--text-3)}
.side-scroll{flex:1;overflow-y:auto}
.row{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:var(--radius);cursor:pointer;color:var(--text-2);font-size:13px;position:relative;user-select:none}
.row:hover{background:var(--bg)}
.row .tw{width:14px;flex:none;color:var(--text-3);font-size:9px;transition:transform .15s}
.row .tw.open{transform:rotate(90deg)}
.row .tw.ghost{visibility:hidden}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .dots{display:none;color:var(--text-3)}
.row:hover .dots{display:block}
.children.hidden{display:none}
.side-foot{border-top:1px solid var(--border);padding:10px 14px;font-size:12px;color:var(--text-3)}
.side-foot button:hover{color:var(--brand)}
/* 主区 */
.main{flex:1;min-width:0;overflow-y:auto}
.pbar{position:sticky;top:0;display:flex;align-items:center;gap:10px;padding:10px 44px;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);z-index:5;font-size:12.5px;color:var(--text-3)}
.pbar .c{cursor:pointer;border-radius:4px;padding:2px 6px}
.pbar .c:hover{background:var(--brand-soft);color:var(--brand)}
.pbar .c.here{color:var(--text);font-weight:600;cursor:default}
.pbar .c.here:hover{background:none}
.pbar .sep{color:var(--border-strong)}
.pbar .ops{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border-radius:var(--radius);padding:6px 14px;font-size:12.5px;font-weight:600}
.btn.pri{background:var(--blue);color:#fff}
.btn.pri:hover{background:#0065ff}
.btn.ghost{border:1px solid var(--border-strong);color:var(--text-2)}
.btn.ghost:hover{background:var(--bg)}
.doc{max-width:820px;margin:0 auto;padding:30px 48px 100px}
.doc h1{font-size:26px;margin-bottom:6px}
.doc .m{font-size:12px;color:var(--text-3);margin-bottom:22px}
.doc p{font-size:14.5px;line-height:1.95;color:var(--text-2);margin-bottom:13px}
.doc [contenteditable="true"]{outline:none;background:#fffef5;box-shadow:0 0 0 2px #ffe380 inset;border-radius:4px;padding:2px}
.doc .editing-tip{background:#fff7d6;border:1px solid #ffe380;border-radius:var(--radius);padding:8px 14px;font-size:12px;color:var(--text-2);margin-bottom:16px;display:none}
.ptable{width:100%;border-collapse:collapse;font-size:13px;margin:14px 0}
.ptable th{text-align:left;font-size:11px;color:var(--text-3);border-bottom:1px solid var(--border);padding:7px 10px}
.ptable td{border-bottom:1px solid var(--border);padding:8px 10px;color:var(--text-2)}
.ptable tr:hover td{background:var(--bg)}
.ptable a{color:var(--brand);cursor:pointer;text-decoration:none;font-weight:500}
.tabs{display:flex;gap:14px;border-bottom:2px solid var(--border);padding:0 44px;margin-top:4px}
.tabs button{padding:9px 2px;font-size:13px;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
.empty-main{padding:100px 40px;text-align:center;color:var(--text-3)}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#172b4d;color:#fff;font-size:13px;padding:9px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:.94}
.mock-note{position:fixed;right:14px;bottom:10px;font-size:10.5px;color:var(--text-3);z-index:70}
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">Confluence · 风格原型</span>
  <div class="urlbar" id="urlbar"></div>
  <span class="hint">空间=强容器 · Overview 是可编辑页面（试试编辑！）</span>
</div>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>
</div>
<div class="toast" id="toast"></div>
<div class="mock-note">模拟行为，细节为合理推测 · 数据与其他风格原型一致</div>
<script>
const K=(id,key,name,desc,color,children)=>({id,key,name,desc,color,children});
const F=(id,name,children)=>({id,name,children});
const N=(id,name,ts,body)=>({id,name,ts,body});
const DATA=[
 K("kb-app","APP","实际应用","产品部署、上线与日常运维。","linear-gradient(135deg,#5b8def,#3f6bd8)",[
   F("f-build","编译产物",[N("n1","产物命名规范","10-27","<p>按 <b>模块-版本-哈希</b> 命名，禁止手工改名。</p><p>例：baseforge-web-1.4.2-8ac31f.tar.gz</p>"),N("n2","清理策略","10-26","<p>保留最近 20 个版本，每日凌晨自动清理。</p>")]),
   F("f-deploy","部署",[N("n3","上线检查清单","10-27","<p>上线前逐项确认：迁移、灰度、监控。</p>"),N("n4","回滚手册","10-25","<p>先回代码再回数据，双人复核。</p>")]),
   F("f-req","需求池",[N("n5","10 月需求评审结论","10-24","<p>知识库交互重构定稿。</p>")])]),
 K("kb-work","WRK","工作笔记","个人日常记录与周报。","linear-gradient(135deg,#59c39a,#2f9e77)",[
   N("n6","周报 1028","10-28","<p>本周：知识库重构调研完成。</p>"),N("n7","1:1 记录","10-21","<p>详情页信息架构对齐。</p>")]),
 K("kb-design","DSN","设计","视觉与交互规范。","linear-gradient(135deg,#e8a33d,#d98a2b)",[
   F("f-ds","组件规范",[N("n8","按钮层级","10-20","<p>主按钮每屏最多一个。</p>")]),
   N("n9","色彩 tokens","10-19","<p>语义色一律走 token。</p>")]),
 K("kb-empty","EMP","空库演示","","linear-gradient(135deg,#b0b0aa,#8f8d83)",[]),
];
const cnt=n=>n.children?n.children.reduce((s,c)=>s+cnt(c),0):1;
const st={mode:"dir",kb:null,tab:"overview",exp:new Set(["f-deploy"]),sel:"overview",editing:false};
const $=s=>document.querySelector(s);
const sb=$("#sidebar"),main=$("#main"),urlbar=$("#urlbar"),toastEl=$("#toast");
let tt;const toast=m=>{toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("show"),1800)};
function renderUrl(){
  urlbar.innerHTML = st.mode==="dir"
    ? `confluence/<b>spaces</b>/ <span style="color:var(--text-3)">（空间目录）</span>`
    : `confluence/<b>spaces</b>/:${st.kb.key}${st.sel==="overview"?` <span style="color:var(--text-3)">（overview）</span>`:`/<b>pages</b>/:pageId/${st.sel}`}`;
}
function renderSide(){
  if(st.mode==="dir"){
    sb.innerHTML=`<div class="dir-h"><h3>空间目录</h3><p>Confluence：空间（Space）是顶层强容器，空间不可嵌套</p></div>
      <div class="dir-search">🔍<input id="dq" placeholder="搜索空间…"></div>
      <div id="spList"></div>`;
    const draw=q=>{sb.querySelector("#spList").innerHTML=DATA.filter(k=>!q||k.name.includes(q))
      .map(k=>`<div class="sp-item" data-kb="${k.id}"><div class="lg" style="background:${k.color}">${k.key[0]}</div>
        <div><b>${k.name}</b><span class="s">${k.key} · ${cnt(k)} 页 · 最近更新 ${lastTs(k)||"—"}</span></div>
        <span class="star ${k.star?"on":""}" data-star="${k.id}">★</span></div>`).join("")
      ||`<div style="padding:30px;text-align:center;color:var(--text-3);font-size:12.5px">无匹配空间</div>`;
      sb.querySelectorAll("[data-kb]").forEach(el=>el.onclick=e=>{if(e.target.dataset.star)return;enterKb(el.dataset.kb)});
      sb.querySelectorAll("[data-star]").forEach(el=>el.onclick=e=>{e.stopPropagation();const k=DATA.find(x=>x.id===el.dataset.star);k.star=!k.star;draw(q);toast(k.star?"已加星标":"已取消星标")});};
    draw("");
    sb.querySelector("#dq").addEventListener("input",e=>draw(e.target.value.trim()));
  } else {
    const k=st.kb;
    sb.innerHTML=`<div class="sp-head" style="cursor:pointer" onclick="backToDir()"><div class="lg" style="background:${k.color}">${k.key[0]}</div><b>${k.name}</b><span class="s">${k.key} · ← 返回空间目录</span></div>
      <div class="sp-nav">
        <div class="nv ${st.tab==="overview"?"on":""}" data-tab="overview">🏠 Overview<span class="n">首页</span></div>
        <div class="nv ${st.tab==="pages"?"on":""}" data-tab="pages">📄 Pages<span class="n">${cnt(k)}</span></div>
        <div class="nv" onclick="toast('Blog（模拟）')">📰 Blog</div>
        <div class="nv" onclick="toast('Apps（模拟）')">🧩 Apps</div>
        <div class="nv" onclick="toast('空间设置（模拟）')">⚙️ Settings</div>
      </div>
      <div class="side-scroll" id="pgTree">${st.tab==="pages"?treeHtml(k.children,0):""}</div>
      <div class="side-foot"><button onclick="toast('空间设置（模拟）')">空间设置</button> · 空间不可嵌套</div>`;
    sb.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{st.tab=b.dataset.tab;st.sel=b.dataset.tab==="overview"?"overview":st.sel;st.editing=false;renderSide();renderMain()});
    sb.querySelectorAll("[data-tw]").forEach(b=>b.onclick=e=>{e.stopPropagation();const i=b.dataset.tw;st.exp.has(i)?st.exp.delete(i):st.exp.add(i);renderSide()});
    sb.querySelectorAll("[data-doc]").forEach(el=>el.onclick=()=>{st.tab="pages";st.sel=el.dataset.doc;st.editing=false;renderSide();renderMain()});
    sb.querySelectorAll("[data-fold]").forEach(el=>el.onclick=()=>{st.exp.has(el.dataset.fold)?st.exp.delete(el.dataset.fold):st.exp.add(el.dataset.fold);renderSide()});
  }
  renderUrl();
}
function lastTs(k){let m=null;const w=n=>{if(n.ts&&(!m||n.ts>m))m=n.ts;(n.children||[]).forEach(w)};w(k);return m}
function treeHtml(list,d){return (list||[]).map(n=>{
  const isF=!!n.children,open=st.exp.has(n.id);
  return `<div class="row" style="margin-left:${d*14}px">
    ${isF?`<button class="tw ${open?"open":""}" data-tw="${n.id}">▶</button>`:`<span class="tw ghost">▶</span>`}
    <span class="name" ${isF?`data-fold="${n.id}"`:`data-doc="${n.id}"`}>${isF?"📁 ":"📄 "}${n.name}</span>
    <span class="dots">⋯</span></div>`+(isF&&open?treeHtml(n.children,d+1):"");}).join("")}
function enterKb(id){st.kb=DATA.find(k=>k.id===id);st.mode="space";st.tab="overview";st.sel="overview";st.editing=false;renderSide();renderMain()}
function backToDir(){st.mode="dir";st.kb=null;renderSide();renderMain()}
function findDoc(k,id){let r=null;const w=l=>(l||[]).forEach(n=>{if(n.id===id)r=n;w(n.children)});w(k.children);return r}
function renderMain(){
  if(st.mode==="dir"){main.innerHTML=`<div class="empty-main"><h2 style="font-size:20px;color:var(--text-2)">选择一个空间</h2><p style="margin-top:10px;font-size:13.5px">Confluence 模式：空间目录 → 空间侧栏（Overview/Pages/Blog）→ 页面树。<br>每个空间自动带一个 Overview 首页——它是一篇<b>真实可编辑的页面</b>。</p></div>`;return}
  const k=st.kb;
  if(st.tab==="overview") return renderOverview(k);
  const d=findDoc(k,st.sel);
  main.innerHTML=`<div class="pbar"><span class="c" data-go="ov">🏠 Overview</span><span class="sep">›</span><span class="c here">📄 ${d?d.name:""}</span>
      <span class="ops">${st.editing?'<button class="btn pri" onclick="publish()">发布</button>':`<button class="btn ghost" onclick="editPage()">✏️ 编辑</button>`}<button class="btn ghost" onclick="toast('点赞/评论（模拟）')">👍</button></span></div>
    <div class="doc"><h1>${d?d.name:""}</h1><div class="m">@wushuzhilu · 编辑于 ${d?d.ts:"—"}</div>
      <div class="editing-tip" style="display:${st.editing?"block":"none"}">⚠️ 编辑中——直接点文字改，改完点右上角「发布」。Confluence：空间里的页面都是真实文档。</div>
      <div id="docBody" contenteditable="${st.editing}">${d?d.body.replace(/<\/?p>/g,"<p style='margin-bottom:12px'>"):""}</div></div>`;
  main.querySelector('[data-go="ov"]').onclick=()=>{st.tab="overview";st.sel="overview";st.editing=false;renderSide();renderMain()};
  if(st.editing) main.querySelector("#docBody").focus();
}
function renderOverview(k){
  const empty=cnt(k)===0;
  main.innerHTML=`<div class="pbar"><span class="c here">🏠 Overview · ${k.name}</span>
      <span class="ops">${st.editing?'<button class="btn pri" onclick="publish()">发布</button>':`<button class="btn ghost" onclick="editPage()">✏️ 编辑 Overview</button>`}<button class="btn ghost" onclick="toast('空间管理（模拟）')">⚙️</button></span></div>
    <div class="tabs"><button class="on">概览</button><button onclick="toast('最近更新（模拟）')">最近更新</button><button onclick="toast('空间分析（模拟）')">分析</button></div>
    <div class="doc">
      <div class="editing-tip" style="display:${st.editing?"block":"none"}">⚠️ Overview 编辑中——这是真实页面，改完「发布」会保存回数据。</div>
      <div id="docBody" contenteditable="${st.editing}">
        ${empty?`<h1>欢迎来到 ${k.name} 空间 👋</h1><p>Confluence 在<b>创建空间时自动生成这篇 Overview</b>——所以空空间没有"空态引导"，而是一篇现成的可编辑欢迎页。</p><p>把这段话改成你们团队的空间公约，然后点「发布」。</p>`
        :`<h1>${k.name}</h1><p>${k.desc}</p><h2 style="font-size:17px;margin:18px 0 8px">空间内容</h2>
          <table class="ptable"><tr><th>页面</th><th>更新</th></tr>${topRows(k.children)}</table>`}
      </div></div>`;
  main.querySelectorAll("[data-pg]").forEach(el=>el.onclick=()=>{st.tab="pages";st.sel=el.dataset.pg;st.editing=false;renderSide();renderMain()});
}
function topRows(list){return (list||[]).map(n=>`<tr><td>${n.children?"📁":`<a data-pg="${n.id}">📄 ${n.name}</a>`}</td><td>${n.ts||(n.children?cnt(n)+" 篇":"—")}</td></tr>`).join("")}
function editPage(){st.editing=true;renderMain();toast("已进入编辑（contenteditable）")}
function publish(){
  const body=main.querySelector("#docBody").innerHTML;
  if(st.tab==="overview"){const k=st.kb;k.children=k.children||[];const ov=k.children.find(n=>n.id==="overview-page");
    const txt=body.replace(/<[^>]+>/g," ").trim().slice(0,60);
    if(ov)ov.body=`<p>${txt}…</p>`;}
  else{const d=findDoc(st.kb,st.sel);if(d)d.body=body;}
  st.editing=false;renderSide();renderMain();toast("已发布，真实保存回数据（Confluence：首页就是文档）");
}
renderSide();renderMain();
</script>
</body>
</html>
