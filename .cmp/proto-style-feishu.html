<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>风格原型 · 飞书知识库（主页+整树切换）</title>
<style>
:root{--bg:#f2f3f5;--panel:#fff;--border:#e1e3e8;--border-strong:#d0d3da;--text:#1f2329;--text-2:#51565f;--text-3:#8f959e;--brand:#3370ff;--brand-soft:#eaf1ff;--amber:#e8a33d;--radius:8px;--radius-lg:12px;--shadow:0 1px 3px rgba(31,35,41,.08),0 6px 20px rgba(31,35,41,.08);font-size:15px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.topbar{height:46px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border)}
.logo{font-weight:700;font-size:14px;color:var(--brand)}
.urlbar{flex:1;max-width:600px;display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:5px 14px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--text-2)}
.urlbar b{color:var(--brand);font-weight:600}
.hint{margin-left:auto;font-size:12px;color:var(--text-3)}
.layout{display:flex;height:calc(100vh - 46px)}
.sidebar{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.side-head{padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
.side-head .ttl{font-size:15px;font-weight:600}
.side-head .mini{margin-left:auto;font-size:12px;color:var(--text-3)}
.sec{padding:4px 10px}
.sec-h{display:flex;align-items:center;gap:6px;height:34px;padding:0 8px;border-radius:var(--radius);font-size:13.5px;font-weight:600;color:var(--text);cursor:pointer}
.sec-h:hover{background:var(--bg)}
.sec-h .ar{font-size:10px;color:var(--text-3);transition:transform .15s}
.sec-h .ar.open{transform:rotate(90deg)}
.sec-h .n{margin-left:auto;font-size:11px;color:var(--text-3);font-weight:400}
.side-body{flex:1;overflow-y:auto;padding-bottom:14px}
/* 库列表行 */
.wk{display:flex;align-items:center;gap:10px;height:36px;padding:0 8px 0 26px;border-radius:var(--radius);cursor:pointer;color:var(--text-2);font-size:13.5px}
.wk:hover{background:var(--bg)}
.wk.on{background:var(--brand-soft);color:var(--brand);font-weight:500}
.wk .ic{width:20px;height:20px;border-radius:5px;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;flex:none}
.wk .mem{margin-left:auto;font-size:11px;color:var(--text-3)}
/* 库内树 */
.kb-head-tree{padding:10px 12px;border-bottom:1px solid var(--border)}
.kb-card{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius);cursor:pointer}
.kb-card:hover{background:var(--bg)}
.kb-card .ic{width:34px;height:34px;border-radius:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.kb-card b{font-size:14px}
.kb-card .s{font-size:11px;color:var(--text-3)}
.kb-ops{display:flex;gap:6px;margin-top:6px}
.kb-ops button{flex:1;font-size:12px;padding:6px 0;border-radius:var(--radius);background:var(--bg);color:var(--text-2)}
.kb-ops button:hover{background:var(--brand-soft);color:var(--brand)}
.row{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;border-radius:var(--radius);cursor:pointer;color:var(--text-2);position:relative;user-select:none}
.row:hover{background:var(--bg)}
.row.on{background:var(--brand-soft);color:var(--brand);font-weight:500}
.row .tw{width:16px;flex:none;color:var(--text-3);font-size:10px;transition:transform .15s}
.row .tw.open{transform:rotate(90deg)}
.row .tw.ghost{visibility:hidden}
.row .ico{flex:none;width:18px;text-align:center}
.row.folder>.ico{color:var(--amber)}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .plus{display:none;width:20px;height:20px;border-radius:5px;color:var(--text-3);font-size:13px;align-items:center;justify-content:center}
.row:hover .plus{display:flex}
.row .plus:hover{background:var(--brand-soft);color:var(--brand)}
.children.hidden{display:none}
.tree-foot{border-top:1px solid var(--border);padding:10px 14px;font-size:12px;color:var(--text-3);display:flex;gap:10px}
.tree-foot button:hover{color:var(--brand)}
/* 主区 */
.main{flex:1;min-width:0;overflow-y:auto}
.crumb{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:12px 44px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(6px);font-size:12.5px;color:var(--text-3);border-bottom:1px solid var(--border);z-index:5}
.crumb .c{cursor:pointer;border-radius:6px;padding:2px 6px}
.crumb .c:hover{background:var(--brand-soft);color:var(--brand)}
.crumb .c.here{color:var(--text);font-weight:600;cursor:default}
.crumb .c.here:hover{background:none}
.crumb .sep{color:var(--border-strong)}
.doc{max-width:760px;margin:0 auto;padding:34px 48px 90px}
.doc h1{font-size:25px;margin-bottom:6px}
.doc .m{font-size:12px;color:var(--text-3);margin-bottom:24px}
.doc p{font-size:14.5px;line-height:1.95;color:var(--text-2);margin-bottom:14px}
.doc blockquote{border-left:3px solid var(--brand);padding:4px 16px;color:var(--text-3);margin:14px 0;font-size:13.5px}
/* 主页空态/引导 */
.home-hero{max-width:900px;margin:0 auto;padding:40px 40px 70px}
.home-hero h2{font-size:22px}
.home-hero .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:20px}
.kcard{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;cursor:pointer;transition:.15s}
.kcard:hover{border-color:var(--brand);box-shadow:var(--shadow);transform:translateY(-2px)}
.kcard .ic{width:38px;height:38px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px}
.kcard b{font-size:14px}
.kcard .s{font-size:11.5px;color:var(--text-3);margin-top:4px}
.empty-tree{padding:60px 20px;text-align:center;color:var(--text-3);font-size:13px}
.empty-tree button{margin-top:14px;background:var(--brand);color:#fff;border-radius:999px;padding:8px 20px;font-size:13px}
/* 分享弹层 */
.pop{position:fixed;z-index:45;width:250px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:10px;display:none}
.pop.show{display:block}
.pop button{display:flex;width:100%;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--radius);font-size:13px;color:var(--text-2)}
.pop button:hover{background:var(--brand-soft);color:var(--brand)}
.pop .h{font-size:11px;color:var(--text-3);padding:2px 10px 6px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:var(--text);color:#fff;font-size:13px;padding:9px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:.94}
.mock-note{position:fixed;right:14px;bottom:10px;font-size:10.5px;color:var(--text-3);z-index:70}
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">飞书知识库 · 风格原型</span>
  <div class="urlbar" id="urlbar"></div>
  <span class="hint">主页分区 → 进库整树切换 · 无聚合详情页</span>
</div>
<div class="layout">
  <aside class="sidebar">
    <div class="side-head" id="sideHead"><span class="ttl">云文档</span><span class="mini">搜索 ⌘K</span></div>
    <div class="side-body" id="sideBody"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="pop" id="pop">
  <div class="h">分享「<span id="popKb"></span>」</div>
  <button onclick="toast('链接已复制：feishu.cn/wiki/'+curId+'（模拟）')">🔗 复制链接</button>
  <button onclick="toast('已发布到互联网，免登录可读（模拟）')">🌐 发布到互联网</button>
</div>
<div class="toast" id="toast"></div>
<div class="mock-note">模拟行为，细节为合理推测 · 数据与其他风格原型一致</div>
<script>
const K=(id,name,desc,color,children)=>({id,name,desc,color,children});
const F=(id,name,children)=>({id,name,children});
const N=(id,name,ts,body)=>({id,name,ts,body});
const DATA=[
 K("kb-app","实际应用","产品部署、上线与日常运维。","linear-gradient(135deg,#5b8def,#3f6bd8)",[
   F("f-build","编译产物",[N("n1","产物命名规范","10-27","<p>按 <b>模块-版本-哈希</b> 命名，禁止手工改名。</p><blockquote>例：baseforge-web-1.4.2-8ac31f.tar.gz</blockquote>"),N("n2","清理策略","10-26","<p>保留最近 20 个版本。</p>")]),
   F("f-deploy","部署",[N("n3","上线检查清单","10-27","<p>迁移、灰度、监控逐项确认。</p>"),N("n4","回滚手册","10-25","<p>先回代码再回数据。</p>")]),
   F("f-req","需求池",[N("n5","10 月需求评审结论","10-24","<p>知识库交互重构定稿。</p>")])]),
 K("kb-work","工作笔记","个人日常记录与周报。","linear-gradient(135deg,#59c39a,#2f9e77)",[
   N("n6","周报 1028","10-28","<p>本周：知识库重构调研完成。</p>"),N("n7","1:1 记录","10-21","<p>与设计对齐详情页信息架构。</p>")]),
 K("kb-design","设计","视觉与交互规范。","linear-gradient(135deg,#e8a33d,#d98a2b)",[
   F("f-ds","组件规范",[N("n8","按钮层级","10-20","<p>主按钮每屏最多一个。</p>")]),
   N("n9","色彩 tokens","10-19","<p>语义色走 token。</p>")]),
 K("kb-empty","空库演示","","linear-gradient(135deg,#b0b0aa,#8f8d83)",[]),
];
const myDocs=[N("m1","个人：草稿箱","10-28","<p>（我的文档库里的独立单树）</p>"),N("m2","个人：OKR Q4","10-26","<p>KR1 知识库重构上线。</p>")];
const cnt=n=>n.children?n.children.reduce((s,c)=>s+cnt(c),0):1;
const st={mode:"home",kb:null,cur:null,exp:new Set(["kb-app","f-deploy"]),secOpen:{kb:true,my:true},sel:null};
const $=s=>document.querySelector(s);
const side=$("#sideBody"),main=$("#main"),urlbar=$("#urlbar"),toastEl=$("#toast");
let tt; const toast=m=>{toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("show"),1800)};
let curId="";
function renderUrl(){
  urlbar.innerHTML = st.mode==="home"
    ? `feishu.cn/<b>wiki</b>/ <span style="color:var(--text-3)">（知识库首页）</span>`
    : `feishu.cn/<b>wiki</b>/:node_token <span style="color:var(--text-3)">${curId}(${st.cur?st.cur.name:""})</span>`;
}
function renderSide(){
  if(st.mode==="home"){
    $("#sideHead").innerHTML=`<span class="ttl">云文档</span><span class="mini">搜索 ⌘K</span>`;
    side.innerHTML=`
      <div class="sec"><div class="sec-h" data-sec="my"><span class="ar ${st.secOpen.my?"open":""}">▶</span>📂 我的文档库<span class="n">${myDocs.length}</span></div>
        <div class="${st.secOpen.my?"":"hidden"} children">${myDocs.map(d=>`<div class="wk" data-my="${d.id}"><span class="ic" style="background:#9aa7ff">📄</span>${d.name}</div>`).join("")}</div></div>
      <div class="sec"><div class="sec-h" data-sec="kb"><span class="ar ${st.secOpen.kb?"open":""}">▶</span>📚 知识库<span class="n">${DATA.length}</span></div>
        <div class="${st.secOpen.kb?"":"hidden"} children">${DATA.map(k=>`<div class="wk" data-kb="${k.id}"><span class="ic" style="background:${k.color}">K</span>${k.name}<span class="mem">${cnt(k)}页</span></div>`).join("")}</div></div>
      <div class="sec"><div class="sec-h"><span class="ar ghost" style="visibility:hidden">▶</span>☁️ 云盘</div></div>`;
    side.querySelectorAll("[data-sec]").forEach(h=>h.onclick=()=>{const k=h.dataset.sec;st.secOpen[k]=!st.secOpen[k];renderSide()});
    side.querySelectorAll("[data-kb]").forEach(el=>el.onclick=()=>enterKb(el.dataset.kb));
    side.querySelectorAll("[data-my]").forEach(el=>el.onclick=()=>{const d=myDocs.find(x=>x.id===el.dataset.my);st.cur=d;curId=d.id;renderDoc(d,null)});
  } else {
    const k=st.kb, empty=cnt(k)===0;
    $("#sideHead").innerHTML=`<span class="ttl">${k.name}</span><span class="mini">← 全部知识库</span>`;
    $("#sideHead").onclick=()=>{st.mode="home";st.kb=null;st.cur=null;renderSide();renderMain();renderUrl()};
    side.innerHTML=`<div class="kb-head-tree">
        <div class="kb-card"><div class="ic" style="background:${k.color}">K</div><div><b>${k.name}</b><div class="s">${cnt(k)} 页 · 3 成员</div></div></div>
        <div class="kb-ops"><button onclick="showPop()">🔗 分享</button><button onclick="toast('知识库设置（模拟）')">⚙️ 设置</button></div>
      </div>
      ${empty?`<div class="empty-tree">这个知识库还没有页面<br>点目录顶部「＋」建第一个一级页面<button onclick="newTopPage()">＋ 新建一级页面</button></div>`
        :`<div class="sec"><div class="sec-h" style="height:38px"><span>☰ 目录</span><button class="plus" style="display:flex;margin-left:auto" onclick="newTopPage()">＋</button></div>`+treeHtml(k.children,0)+`</div>`}
      <div class="tree-foot"><button onclick="toast('知识库设置（模拟）')">⚙️ 知识库设置</button><button onclick="toast('回收站（模拟）')">🗑️</button></div>`;
    side.querySelectorAll("[data-tw]").forEach(b=>b.onclick=e=>{e.stopPropagation();const i=b.dataset.tw;st.exp.has(i)?st.exp.delete(i):st.exp.add(i);renderSide()});
    side.querySelectorAll("[data-doc]").forEach(el=>el.onclick=()=>openDoc(el.dataset.doc));
    side.querySelectorAll("[data-fold]").forEach(el=>el.onclick=()=>{st.exp.has(el.dataset.fold)?st.exp.delete(el.dataset.fold):st.exp.add(el.dataset.fold);renderSide()});
    side.querySelectorAll("[data-add]").forEach(b=>b.onclick=e=>{e.stopPropagation();newSubPage(b.dataset.add)});
  }
  renderUrl();
}
function treeHtml(list,d){return (list||[]).map(n=>{
  const isF=!!n.children, open=st.exp.has(n.id), on=st.cur&&st.cur.id===n.id?" on":"";
  return `<div class="row${on}" style="margin-left:${d*16}px">
    ${isF?`<button class="tw ${open?"open":""}" data-tw="${n.id}">▶</button>`:`<span class="tw ghost">▶</span>`}
    <span class="ico">${isF?"📁":"📄"}</span>
    <span class="name" ${isF?`data-fold="${n.id}"`:`data-doc="${n.id}"`}>${n.name}</span>
    <button class="plus" data-add="${n.id}">＋</button></div>`
    +(isF&&open?treeHtml(n.children,d+1):"");}).join("")}
function enterKb(id){
  st.kb=DATA.find(k=>k.id===id); st.mode="tree"; st.exp.add(id); st.cur=null; renderSide(); renderMain();
}
function openDoc(id){const f=findNode(st.kb.children,id);st.cur=f;curId=id;renderSide();renderDoc(f,st.kb)}
function findNode(l,id){let r=null;const w=n=>{if(n.id===id)r=n;(n.children||[]).forEach(w)};w(l);return r}
function chainOf(id){const ch=[];const w=(l,path)=>(l||[]).forEach(n=>{if(n.id===id)ch.push(...path,n);else w(n.children,[...path,n])});w(st.kb.children,[]);return ch}
function renderDoc(cur,kb){
  const ch=chainOf(cur.id);
  main.innerHTML=`<div class="crumb">
      <span class="c" data-crumb="${kb.id}">📚 ${kb.name}</span>
      ${ch.slice(0,-1).map(p=>`<span class="sep">›</span><span class="c" data-crumb="${p.id}">${p.name}</span>`).join("")}
      <span class="sep">›</span><span class="c here">${cur.name}</span>
      <span style="margin-left:auto">更新于 ${cur.ts||"—"}</span></div>
    <div class="doc"><h1>${cur.name}</h1><div class="m">@wushuzhilu · 编辑于 ${cur.ts||"—"}</div>${cur.body||"<p>（空页面）</p>"}</div>`;
  main.querySelectorAll("[data-crumb]").forEach(el=>el.onclick=()=>{
    const id=el.dataset.crumb;
    if(id===kb.id){st.cur=null;renderSide();renderMain();renderUrl();}
    else{const p=findNode(st.kb.children,id);if(p.children){st.exp.add(id);st.cur=null;renderSide();renderMain();renderUrl();toast("跳到目录节点（飞书：面包屑点目录=回到该层级）")}}
  });
  renderUrl();
}
function renderMain(){
  if(st.mode==="home"){
    main.innerHTML=`<div class="home-hero"><h2>📚 知识库</h2>
      <div class="cards">${DATA.map(k=>`<div class="kcard" data-kc="${k.id}"><div class="ic" style="background:${k.color}">K</div><b>${k.name}</b><div class="s">${k.desc||"空知识库"} · ${cnt(k)} 页</div></div>`).join("")}</div>
      <p style="margin-top:22px;font-size:12.5px;color:var(--text-3)">飞书模式：卡片/侧栏进入后，侧栏整体切换为该库页面树，主区永远是文档本体 + 面包屑——没有库详情聚合页。</p></div>`;
    main.querySelectorAll("[data-kc]").forEach(el=>el.onclick=()=>enterKb(el.dataset.kc));
    return;
  }
  if(!st.cur){const k=st.kb;main.innerHTML=`<div style="padding:90px 40px;text-align:center;color:var(--text-3)"><h2 style="font-size:20px;color:var(--text-2)">📚 ${k.name}</h2><p style="margin-top:10px;font-size:13.5px">从左侧目录选一页打开<br>（飞书没有库详情页：主区要么是文档，要么是空引导）</p></div>`}
}
function newTopPage(){const n=N("n-new"+Date.now(),"未命名页面","刚刚","<p>开始输入…</p>");st.kb.children.push(n);st.cur=n;curId=n.id;renderSide();renderDoc(n,st.kb);toast("已创建并进入编辑（飞书：＋ 立即出现在树里）")}
function newSubPage(pid){const f=findNode(st.kb.children,pid);f.children=f.children||[];const n=N("n-new"+Date.now(),"子页面","刚刚","<p>开始输入…</p>");f.children.push(n);st.exp.add(pid);st.cur=n;curId=n.id;renderSide();renderDoc(n,st.kb)}
function showPop(){const p=$("#pop");$("#popKb").textContent=st.kb.name;p.classList.add("show");const r=document.querySelector(".kb-ops").getBoundingClientRect();p.style.left=r.left+"px";p.style.top=(r.bottom+6)+"px"}
document.addEventListener("click",e=>{if(!e.target.closest("#pop")&&!e.target.closest(".kb-ops"))$("#pop").classList.remove("show")});
renderSide();renderMain();
</script>
</body>
</html>
