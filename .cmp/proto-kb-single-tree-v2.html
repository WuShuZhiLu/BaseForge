<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>原型 v2 · 单树直展开 + Overview + 库内树空间</title>
<style>
:root{--bg:#f6f6f4;--panel:#fff;--border:#e4e4e0;--border-strong:#d4d4cf;--text:#26251f;--text-2:#5c5a52;--text-3:#8f8d83;--brand:#2f6f4f;--brand-soft:#e8f1ea;--amber:#e8a33d;--danger:#c2453a;--radius:8px;--radius-lg:12px;--shadow:0 1px 2px rgba(30,30,20,.05),0 4px 16px rgba(30,30,20,.06);font-size:15px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.topbar{height:46px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border)}
.logo{font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--brand)}
.urlbar{flex:1;max-width:580px;display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:5px 14px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--text-2)}
.urlbar b{color:var(--brand)}
.hint{margin-left:auto;font-size:12px;color:var(--text-3)}
.layout{display:flex;height:calc(100vh - 46px)}
/* 侧栏 */
.sidebar{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.viewtabs{display:flex;gap:4px;padding:10px 12px 8px;border-bottom:1px solid var(--border);align-items:center}
.vtab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:30px;border-radius:var(--radius);font-size:12.5px;color:var(--text-3)}
.vtab:hover{background:var(--bg)}
.vtab.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.vtab .bk{color:var(--amber)}
.vtab:disabled{opacity:.4;cursor:not-allowed}
.side-head{display:flex;align-items:center;padding:10px 14px 6px;font-size:12px;letter-spacing:.1em;color:var(--text-3)}
.side-head .add{margin-left:auto;width:22px;height:22px;border-radius:6px;color:var(--text-3);font-size:15px}
.side-head .add:hover{background:var(--brand-soft);color:var(--brand)}
.side-head .backk{display:none;align-items:center;gap:4px;color:var(--brand);font-size:12px;letter-spacing:0;font-weight:600}
.side-head .backk.show{display:flex}
.tree{flex:1;overflow-y:auto;padding:0 8px 16px}
.row{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;border-radius:var(--radius);cursor:pointer;color:var(--text-2);position:relative;user-select:none}
.row:hover{background:var(--bg)}
.row.selected{background:var(--brand-soft);color:var(--text);font-weight:500}
.row .tw{width:16px;height:16px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:10px;transition:transform .15s;border-radius:4px}
.row .tw:hover{background:var(--border);color:var(--text)}
.row .tw.open{transform:rotate(90deg)}
.row .tw.ghost{visibility:hidden}
.row .ico{flex:none;font-size:14px;width:18px;text-align:center}
.row.kb>.ico,.row.folder>.ico{color:var(--amber)}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.kb>.name{font-weight:600;color:var(--text)}
.row .rc{flex:none;font-size:11px;color:var(--text-3)}
.row .acts{display:none;gap:2px}
.row:hover .acts,.row.selected .acts{display:flex}
.row .acts button{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-3)}
.row .acts button:hover{background:var(--brand-soft);color:var(--brand)}
.children.hidden{display:none}
.legend{border-top:1px solid var(--border);padding:9px 14px;font-size:11px;line-height:1.9;color:var(--text-3)}
.legend b{color:var(--text-2)}
/* 主区 */
.main{flex:1;min-width:0;overflow-y:auto}
.home{max-width:760px;margin:0 auto;padding:80px 40px;text-align:center;color:var(--text-3)}
.home h2{color:var(--text-2);font-size:20px;margin-bottom:10px}
/* Overview */
.ov{max-width:860px;margin:0 auto;padding:44px 48px 80px}
.ov-head{display:flex;align-items:flex-start;gap:18px}
.ov-icon{width:58px;height:58px;flex:none;border-radius:14px;background:linear-gradient(135deg,#fdf3e3,#f7e3bd);display:flex;align-items:center;justify-content:center;font-size:28px}
.ov-title h1{font-size:24px;display:flex;align-items:center;gap:8px}
.ov-title .lock{font-size:13px;color:var(--text-3)}
.ov-stats{margin-top:7px;font-size:12.5px;color:var(--text-3)}
.ov-stats b{color:var(--text-2)}
.ov-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.ov-actions button{border:1px solid var(--border-strong);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--text-2)}
.ov-actions button:hover{border-color:var(--brand);color:var(--brand)}
.ov-actions button.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.ov-actions button.pri:hover{opacity:.9;color:#fff}
.focus-toggle{display:flex;align-items:center;gap:8px;margin-top:20px;background:var(--brand-soft);border:1px dashed color-mix(in srgb,var(--brand) 40%,transparent);border-radius:var(--radius);padding:10px 16px;font-size:12.5px;color:var(--brand);cursor:pointer}
.focus-toggle:hover{background:#dcebe1}
.ov-desc{margin-top:18px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 18px;font-size:13.5px;color:var(--text-2)}
.toc-h{display:flex;align-items:baseline;margin:28px 0 4px}
.toc-h h3{font-size:13px;letter-spacing:.12em;color:var(--text-3)}
.toc-h span{margin-left:12px;font-size:11.5px;color:var(--text-3)}
.tr{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--radius);cursor:pointer;font-size:14px;color:var(--text-2)}
.tr:hover{background:var(--panel)}
.tr .nm{font-weight:500;color:var(--text)}
.tr.folder>.nm{color:var(--text)}
.tr.l2{padding-left:44px}.tr.l3{padding-left:76px}
.tr .ts{margin-left:auto;font-size:12px;color:var(--text-3)}
.empty-ov{margin-top:56px;text-align:center;padding:52px 20px;border:1.5px dashed var(--border-strong);border-radius:var(--radius-lg);background:var(--panel)}
.empty-ov .big{font-size:34px}
.empty-ov h3{margin:12px 0 6px;font-size:16px;color:var(--text-2)}
.empty-ov p{font-size:13px;color:var(--text-3);margin-bottom:18px}
.empty-ov button{background:var(--brand);color:#fff;border-radius:999px;padding:9px 22px;font-size:13.5px}
/* 文档 */
.crumb{position:sticky;top:0;display:flex;align-items:center;gap:8px;padding:12px 48px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);font-size:12.5px;color:var(--text-3);z-index:5}
.crumb .c{cursor:pointer;border-radius:6px;padding:2px 6px}
.crumb .c:hover{background:var(--brand-soft);color:var(--brand)}
.crumb .c.here{color:var(--text);font-weight:600;cursor:default}
.crumb .sep{color:var(--border-strong)}
.doc{max-width:760px;margin:0 auto;padding:40px 48px 90px}
.doc h1{font-size:26px;margin-bottom:8px}
.doc .m{font-size:12px;color:var(--text-3);margin-bottom:24px}
.doc p{font-size:14.5px;line-height:1.95;color:var(--text-2);margin-bottom:14px}
.doc blockquote{border-left:3px solid var(--brand-soft);padding:4px 16px;color:var(--text-3);margin:14px 0;font-size:13.5px}
/* 右键菜单/弹窗/toast */
.ctx{position:fixed;z-index:50;min-width:170px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:5px;display:none}
.ctx.show{display:block}
.ctx button{display:flex;width:100%;align-items:center;gap:10px;padding:7px 12px;border-radius:6px;font-size:13px;color:var(--text-2)}
.ctx button:hover{background:var(--brand-soft);color:var(--brand)}
.ctx button.danger{color:var(--danger)}
.ctx button.danger:hover{background:#fbeae8;color:var(--danger)}
.ctx .sep{height:1px;background:var(--border);margin:5px 8px}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:var(--text);color:#fff;font-size:13px;padding:9px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:.94}
kbd{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;background:var(--bg);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--text-2)}
.mock-note{position:fixed;right:14px;bottom:10px;font-size:10.5px;color:var(--text-3);z-index:70}
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">BaseForge · 原型 v2</span>
  <div class="urlbar" id="urlbar"></div>
  <span class="hint">v2：单击库=展开+Overview · 树上可增删改 · 可切库内树</span>
</div>
<div class="layout">
  <aside class="sidebar">
    <div class="viewtabs">
      <button class="vtab on" id="tabAll">🌳 全部空间</button>
      <button class="vtab" id="tabKb" disabled><span class="bk">📘</span><span id="tabKbName">库内树</span></button>
    </div>
    <div class="side-head"><span id="sideTitle">知识库</span><button class="backk" id="backAll">← 返回全部</button><button class="add" id="addKb" title="新建知识库">＋</button></div>
    <div class="tree" id="tree"></div>
    <div class="legend"><b>单击库根</b>=展开内容+Overview · <b>文件夹</b>=展开/折叠 · <b>文档</b>=打开<br><b>双击/箭头</b>=折叠 · <b>右键</b>=增删改菜单（真实生效）· <kbd>顶部切换</kbd>库内树空间</div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="ctx" id="ctx"></div>
<div class="toast" id="toast"></div>
<div class="mock-note">原型 v2 · 数据与其他风格原型一致 · 删除/重命名真实生效</div>
<script>
const K=(id,name,desc,children)=>({type:"kb",id,name,desc,children});
const F=(id,name,children)=>({type:"folder",id,name,children});
const N=(id,name,ts,body)=>({type:"doc",id,name,ts,body});
let uid=200;
const DATA=[
 K("kb-app","实际应用","产品部署、上线与日常运维的经验沉淀。",[
   F("f-build","编译产物",[N("n1","产物命名规范","10-27 18:22","<p>所有构建产物按 <b>模块-版本-哈希</b> 命名，禁止手工改名。</p><blockquote>baseforge-web-1.4.2-8ac31f.tar.gz</blockquote>"),N("n2","清理策略","10-26 11:02","<p>保留最近 20 个版本，每日凌晨自动清理。</p>")]),
   F("f-deploy","部署",[N("n3","上线检查清单","10-27 18:22","<p>上线前逐项确认：</p><p>① 迁移脚本在预发执行过<br>② 灰度比例与预案<br>③ 监控大盘与告警阈值</p>"),N("n4","回滚手册","10-25 09:41","<p>先回代码，再回数据；数据回滚必须双人复核。</p>")]),
   F("f-req","需求池",[N("n5","10 月需求评审结论","10-24 15:40","<p>知识库交互重构定稿。</p>")])]),
 K("kb-work","工作笔记","个人日常记录与周报。",[
   N("n6","周报 1028","10-28 10:15","<p>本周：知识库重构调研完成。</p>"),N("n7","1:1 记录","10-21 16:30","<p>与设计对齐详情页信息架构。</p>")]),
 K("kb-design","设计","视觉与交互规范。",[
   F("f-ds","组件规范",[N("n8","按钮层级","10-20 14:00","<p>主按钮每屏最多一个。</p>")]),N("n9","色彩 tokens","10-19 09:20","<p>语义色一律走 token。</p>")]),
 K("kb-empty","空库演示",null,[]),
];
const countDocs=n=>n.type==="doc"?1:(n.children||[]).reduce((s,c)=>s+countDocs(c),0);
function maxTs(n){if(n.type==="doc")return n.ts;let m=null;(n.children||[]).forEach(c=>{const t=maxTs(c);if(t&&(!m||t>m))m=t});return m}
function findNode(id,list=DATA,parent=null){for(const n of list){if(n.id===id)return{node:n,parent,list};const f=findNode(id,n.children||[],n);if(f)return f}return null}
function chainOf(id){const ch=[];const w=(l,path)=>(l||[]).forEach(n=>{if(n.id===id)ch.push(...path,n);else w(n.children||[],[...path,n])});w(DATA,[]);return ch}
const nearestKb=f=>{let p=f.parent;while(p&&p.type!=="kb")p=null;return p};

const st={
  exp:new Set(["kb-app","kb-work","kb-design","f-build","f-deploy","f-ds"]), // 库内容默认展开
  sel:null, view:{kind:"home"}, treeMode:"all", focusKb:null, search:"",
};
const $=s=>document.querySelector(s);
const tree=$("#tree"),main=$("#main"),urlbar=$("#urlbar"),ctxEl=$("#ctx"),toastEl=$("#toast");
let tt;const toast=m=>{toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("show"),1800)};

function renderUrl(){
  let h=`<b>/kb/space</b>`;
  if(st.view.kind!=="home"){h+=` / <b>:kbId</b>(${st.view.kbId})`;
    if(st.view.kind==="doc")h+=` / <b>notes/:noteId</b>(${st.view.noteId})`;
    if(st.treeMode==="kb")h+=` <span style="color:var(--text-3)">?view=focus（库内树空间）</span>`;}
  urlbar.innerHTML=h;
}
function renderTabs(){
  $("#tabAll").classList.toggle("on",st.treeMode==="all");
  const kbTab=$("#tabKb");
  kbTab.disabled=!st.focusKb;
  kbTab.classList.toggle("on",st.treeMode==="kb");
  if(st.focusKb){kbTab.style.display="flex";$("#tabKbName").textContent=findNode(st.focusKb).node.name}
  else kbTab.style.display="none";
  $("#sideTitle").style.display=st.treeMode==="kb"?"none":"inline";
  $("#backAll").classList.toggle("show",st.treeMode==="kb");
  $("#addKb").style.display=st.treeMode==="kb"?"none":"flex";
}
$("#tabAll").onclick=()=>{st.treeMode="all";renderAll()};
$("#tabKb").onclick=()=>{if(st.focusKb){st.treeMode="kb";renderAll()}};
$("#backAll").onclick=()=>{st.treeMode="all";renderAll()};

function rowHtml(n,depth){
  const isKb=n.type==="kb",isF=n.type==="folder";
  const hasCh=(n.children||[]).length>0;
  const open=st.exp.has(n.id);
  const sel=st.sel===n.id?" selected":"";
  const ico=isKb?"📘":isF?"📁":"📄";
  const rc=isKb||isF?`<span class="rc">${countDocs(n)}</span>`:`<span class="rc">${n.ts}</span>`;
  const acts=`<span class="acts"><button data-add="${n.id}" title="新建文档">＋</button><button data-menu="${n.id}" title="菜单">⋯</button></span>`;
  return `<div class="row ${isKb?"kb":isF?"folder":"doc"}${sel}" data-id="${n.id}" style="margin-left:${depth*18}px"
    ondblclick="toggleNode('${n.id}')" oncontextmenu="openCtx(event,'${n.id}')">
    ${hasCh?`<button class="tw ${open?"open":""}" data-tw="${n.id}">▶</button>`:`<span class="tw ghost">▶</span>`}
    <span class="ico">${ico}</span><span class="name">${n.name}</span>${rc}${acts}</div>`;
}
function renderTree(){
  let roots=DATA;
  if(st.treeMode==="kb"&&st.focusKb)roots=[findNode(st.focusKb).node];
  const visible=list=>list.filter(n=>!st.search||n.name.toLowerCase().includes(st.search));
  const frag=[];
  const walk=(list,d)=>{for(const n of visible(list)){frag.push(rowHtml(n,d));if((n.children||[]).length&&st.exp.has(n.id)){frag.push(`<div class="children">`);walk(n.children,d+1);frag.push(`</div>`)}}};
  walk(roots,0);
  tree.innerHTML=frag.join("")||`<div style="padding:40px 20px;text-align:center;color:var(--text-3);font-size:12.5px">无匹配</div>`;
}
tree.addEventListener("click",e=>{
  const t=e.target.closest("[data-tw]");if(t){e.stopPropagation();toggleNode(t.dataset.tw);return}
  const a=e.target.closest("[data-add]");if(a){e.stopPropagation();quickAdd(a.dataset.add);return}
  const m=e.target.closest("[data-menu]");if(m){e.stopPropagation();openCtx(e,m.dataset.menu);return}
  const r=e.target.closest(".row");if(r)selectNode(r.dataset.id);
});
$("#addKb").onclick=()=>{
  const kb=K("kb-new-"+(++uid),"新建知识库",null,[]);
  DATA.push(kb);st.exp.add(kb.id);renderAll();
  selectNode(kb.id);toast("已创建空库：树里直接可操作，不会弹回");
};
function toggleNode(id){st.exp.has(id)?st.exp.delete(id):st.exp.add(id);renderTree()}
function selectNode(id){
  const f=findNode(id);if(!f)return;
  const n=f.node;st.sel=id;
  if(n.type==="kb"){
    st.exp.add(id);                 // v2：单击库=展开内容
    st.focusKb=id;                  // 允许切换库内树
    st.view={kind:"detail",kbId:id};
  }else if(n.type==="doc"){
    st.view={kind:"doc",kbId:nearestKb(f)?nearestKb(f).id:null,noteId:id};
  }else{toggleNode(id);renderAll();return}
  renderAll();
}
function openDoc(id){const f=findNode(id);st.sel=id;st.view={kind:"doc",kbId:nearestKb(f)?nearestKb(f).id:null,noteId:id};renderAll()}
function openDetail(kbId){st.sel=kbId;st.focusKb=kbId;st.view={kind:"detail",kbId:kbId};renderAll()}

/* 真实增删改 */
function quickAdd(id){
  const f=findNode(id);const n=f.node;
  const doc=N("n-"+(++uid),"未命名文档","刚刚","<p>开始输入…（原型：新建后直接打开）</p>");
  if(n.type==="doc"){const kb=nearestKb(f);(kb?kb.node.children:DATA).unshift(doc);if(kb)st.exp.add(kb.node.id)}
  else{n.children=n.children||[];n.children.push(doc);st.exp.add(n.id)}
  renderTree();openDoc(doc.id);
}
function ctxAddDoc(id){const f=findNode(id);const n=f.node;const doc=N("n-"+(++uid),"未命名文档","刚刚","<p>开始输入…</p>");
  if(n.type==="kb"||n.type==="folder"){n.children=n.children||[];n.children.push(doc)}else{const kb=nearestKb(f);kb.node.children.unshift(doc)}
  st.exp.add(n.type==="doc"?nearestKb(f).node.id:n.id);renderTree();openDoc(doc.id);ctxEl.classList.remove("show")}
function ctxAddFolder(id){const f=findNode(id);let p=f.node;while(p&&p.type!=="kb"){const ff=findNode(p.id);p=ff?ff.parent:null}
  const target=f.node.type==="doc"?p:f.node;target.children=target.children||[];
  const fo=F("f-"+(++uid),"新建文件夹",[]);target.children.push(fo);st.exp.add(target.id);st.exp.add(fo.id);renderTree();st.sel=fo.id;renderTree();toast("已新建文件夹");ctxEl.classList.remove("show")}
function ctxRename(id){const f=findNode(id);const v=prompt("重命名",f.node.name);if(v!==null&&v.trim()){f.node.name=v.trim();renderAll();toast("已重命名（URL 用 id 主键，链接不失效）")}ctxEl.classList.remove("show")}
function ctxDelete(id){
  const f=findNode(id);if(f.node.type==="kb"&&DATA.length===1)return toast("至少保留一个库");
  if(!confirm(`删除「${f.node.name}」？${f.node.children?`（含 ${countDocs(f.node)} 篇文档）`:""}`))return ctxEl.classList.remove("show");
  const arr=f.parent?f.parent.children:DATA;const i=arr.indexOf(f.node);arr.splice(i,1);
  if(st.sel===id||st.view.kbId===id)st.view={kind:"home"};
  if(st.focusKb===id){st.focusKb=null;st.treeMode="all"}
  st.sel=null;renderAll();toast("已删除");ctxEl.classList.remove("show");
}

/* 右键菜单 */
function openCtx(e,id){
  e.preventDefault();e.stopPropagation();
  const n=findNode(id).node;
  const isDoc=n.type==="doc";
  ctxEl.innerHTML=`${isDoc?"":`<button onclick="ctxAddDoc('${id}')">📄 新建文档</button><button onclick="ctxAddFolder('${id}')">📁 新建文件夹</button><div class="sep"></div>`}
    <button onclick="ctxRename('${id}')">✏️ 重命名</button>
    <button onclick="toast('收藏（原型演示）')">⭐ 收藏</button>
    <button onclick="toast('深链 /kb/space/…（已复制，模拟）')">🔗 复制链接</button>
    <div class="sep"></div><button class="danger" onclick="ctxDelete('${id}')">🗑️ 删除</button>`;
  ctxEl.classList.add("show");
  ctxEl.style.left=Math.min(e.clientX,innerWidth-190)+"px";ctxEl.style.top=Math.min(e.clientY,innerHeight-280)+"px";
}
document.addEventListener("click",e=>{if(!e.target.closest(".ctx"))ctxEl.classList.remove("show")});
document.addEventListener("keydown",e=>{if(e.key==="Escape")ctxEl.classList.remove("show")});

/* 主区 */
function renderMain(){
  const v=st.view;
  if(v.kind==="home"){main.innerHTML=`<div class="home"><h2>单击左侧 📘 知识库</h2><p>单击库根行：<b>树里直接展开内容</b> + 主区显示该库 Overview<br>Overview 页可一键把侧栏切到「库内树空间」（右上角第二个 tab）</p></div>`;return}
  if(v.kind==="detail")return renderDetail(findNode(v.kbId).node);
  renderDoc(findNode(v.noteId).node);
}
function renderDetail(kb){
  const docs=countDocs(kb),empty=docs===0;
  const words=(kb.children||[]).length?1099:0;
  const toc=empty?"":`<div class="toc-h"><h3>目录</h3><span>点击直达 · 单击文件夹只展开，不离开 Overview</span></div>`+tocHtml(kb.children||[],0);
  main.innerHTML=`<div class="ov">
    <div class="ov-head">
      <div class="ov-icon">📘</div>
      <div class="ov-title"><h1>${kb.name} <span class="lock">🔒 私密</span></h1>
        <div class="ov-stats"><b>${docs}</b> 文档 · <b>${words}</b> 字 · 更新于 <b>${maxTs(kb)||"—"}</b> · @wushuzhilu 等 3 人参与编写</div></div>
      <div class="ov-actions"><button onclick="toast('收藏（模拟）')">☆ 收藏</button><button onclick="toast('分享（模拟）')">分享</button><button class="pri" onclick="newFirstDoc()">＋ 新建文档</button></div>
    </div>
    <div class="focus-toggle" onclick="switchFocus()">🔀 切换到「库内树空间」—— 侧栏只显示这个库（对应语雀/Confluence 的库内体验，可随时切回）</div>
    <div class="ov-desc">📌 ${kb.desc||"暂无简介（本期只读）"}</div>
    ${empty?`<div class="empty-ov"><div class="big">🗂️</div><h3>这个知识库还没有内容</h3><p>它在树里正常展开着 —— 不会弹回、不会消失</p><button onclick="newFirstDoc()">＋ 新建第一篇文档</button></div>`:toc}
  </div>`;
  main.querySelectorAll(".tr[data-doc]").forEach(r=>r.onclick=()=>openDoc(r.dataset.doc));
  main.querySelectorAll(".tr[data-folder]").forEach(r=>r.onclick=()=>{st.exp.add(r.dataset.folder);st.sel=r.dataset.folder;renderTree();toast("已展开该文件夹（主区保持在 Overview）")});
}
function tocHtml(list,lv){return (list||[]).map(n=>{
  const ico=n.type==="folder"?"📁":"📄";
  return `<div class="tr l${lv}" ${n.type==="doc"?`data-doc="${n.id}"`:`data-folder="${n.id}"`}>
    <span>${ico}</span><span class="nm">${n.name}</span><span class="ts">${n.type==="folder"?countDocs(n)+" 篇":(maxTs(n)||"").slice(0,5)||"—"}</span></div>`
    +(n.type==="folder"&&st.exp.has(n.id)&&lv<2?tocHtml(n.children,lv+1):"");}).join("")}
function newFirstDoc(){const kb=findNode(st.view.kbId).node;const doc=N("n-"+(++uid),"未命名文档","刚刚","<p>开始输入…</p>");kb.children.push(doc);st.exp.add(kb.id);renderTree();openDoc(doc.id)}
function switchFocus(){st.treeMode="kb";renderAll();toast("侧栏已切到「库内树空间」——顶部 tab 可切回全部空间")}
function renderDoc(n){
  const ch=chainOf(n.id);
  main.innerHTML=`<div class="crumb">
    ${ch.map((p,i)=>`<span class="c ${i===ch.length-1?"here":""}" ${i<ch.length-1?`data-go="${p.id}"`:""}>${p.type==="kb"?"📘":p.type==="folder"?"📁":"📄"} ${p.name}</span>`).join('<span class="sep">›</span>')}
    <span style="margin-left:auto">更新于 ${n.ts||"刚刚"}</span></div>
  <div class="doc"><h1>${n.name}</h1><div class="m">@wushuzhilu · 编辑于 ${n.ts||"刚刚"}</div>${n.body||"<p>（空文档）</p>"}</div>`;
  main.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>{const id=el.dataset.go;const f=findNode(id);f.node.type==="kb"?openDetail(id):(st.exp.add(id),st.sel=id,st.view={kind:"doc",kbId:st.view.kbId,noteId:id},renderAll())});
}
function renderAll(){renderTabs();renderTree();renderMain();renderUrl()}
renderAll();
</script>
</body>
</html>
