<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>风格原型 · 语雀（两级分层）</title>
<style>
:root{--bg:#f6f6f4;--panel:#fff;--border:#e4e4e0;--border-strong:#d4d4cf;--text:#26251f;--text-2:#5c5a52;--text-3:#8f8d83;--brand:#1774c2;--brand-soft:#e8f2fa;--teal:#00b96b;--amber:#e8a33d;--radius:8px;--radius-lg:12px;--shadow:0 1px 2px rgba(30,30,20,.05),0 4px 16px rgba(30,30,20,.06);font-size:15px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.topbar{height:46px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border)}
.logo{font-weight:700;font-size:14px;color:var(--teal)}
.urlbar{flex:1;max-width:600px;display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:5px 14px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--text-2)}
.urlbar b{color:var(--teal);font-weight:600}
.hint{margin-left:auto;font-size:12px;color:var(--text-3)}
.layout{display:flex;height:calc(100vh - 46px)}
/* 侧栏 */
.sidebar{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.side-top{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.side-top .back{display:none;align-items:center;gap:6px;font-size:13px;color:var(--brand);padding:4px 8px;border-radius:6px}
.side-top .back:hover{background:var(--brand-soft)}
.side-top .back.show{display:flex}
.side-top .ttl{font-size:13px;font-weight:600}
.side-top .act{margin-left:auto;width:24px;height:24px;border-radius:6px;color:var(--text-3)}
.side-top .act:hover{background:var(--brand-soft);color:var(--brand)}
.side-body{flex:1;overflow-y:auto;padding:8px}
/* 库列表态 */
.kb-item{display:flex;gap:12px;padding:12px;border-radius:var(--radius);cursor:pointer}
.kb-item:hover{background:var(--bg)}
.kb-item .bk{width:40px;height:52px;flex:none;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.kb-item h4{font-size:14px}
.kb-item p{font-size:12px;color:var(--text-3);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kb-item .meta{margin-top:5px;font-size:11px;color:var(--text-3)}
.sort-row{display:flex;gap:6px;padding:6px 12px 10px;font-size:11.5px;color:var(--text-3);align-items:center}
.sort-row button{padding:3px 10px;border-radius:999px;border:1px solid var(--border);font-size:11.5px;color:var(--text-3)}
.sort-row button.on{background:var(--brand-soft);color:var(--brand);border-color:color-mix(in srgb,var(--brand) 30%,transparent)}
/* 树 */
.row{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;border-radius:var(--radius);cursor:pointer;color:var(--text-2);position:relative;user-select:none}
.row:hover{background:var(--bg)}
.row .tw{width:16px;flex:none;color:var(--text-3);font-size:10px;transition:transform .15s;border-radius:4px}
.row .tw:hover{color:var(--text)}
.row .tw.open{transform:rotate(90deg)}
.row .tw.ghost{visibility:hidden}
.row .ico{flex:none;width:18px;text-align:center}
.row.folder>.ico{color:var(--amber)}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .drag{display:none;position:absolute;right:8px;color:var(--text-3);font-size:13px;cursor:grab}
.row:hover .drag{display:block}
.children.hidden{display:none}
.sec-label{font-size:11px;color:var(--text-3);padding:10px 10px 4px;letter-spacing:.1em}
/* 主区 */
.main{flex:1;min-width:0;overflow-y:auto}
/* 库首页 */
.kb-home .cover{height:150px;display:flex;align-items:flex-end;padding:0 44px 18px;color:#fff;font-size:26px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.kb-home .body{max-width:860px;margin:0 auto;padding:22px 48px 80px}
.kb-meta{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-3)}
.avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#f0b35e,#dd8a3c);display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.kb-desc{margin-top:14px;font-size:13.5px;color:var(--text-2);background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px}
.yq-actions{margin-left:auto;display:flex;gap:8px}
.yq-actions button{border:1px solid var(--border-strong);background:var(--panel);border-radius:999px;padding:5px 13px;font-size:12.5px;color:var(--text-2)}
.yq-actions button:hover{color:var(--teal);border-color:var(--teal)}
.yq-actions button.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.toc-h{margin:26px 0 6px;display:flex;align-items:baseline;gap:10px}
.toc-h h3{font-size:13px;letter-spacing:.12em;color:var(--text-3)}
.toc-h span{font-size:11.5px;color:var(--text-3)}
.tr{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--radius);cursor:pointer;font-size:14px;color:var(--text-2)}
.tr:hover{background:var(--panel)}
.tr .n{color:var(--text-3);font-size:12px;width:22px}
.tr .nm{font-weight:500;color:var(--text)}
.tr.l2{padding-left:52px}
.tr .cnt{margin-left:auto;font-size:11px;color:var(--text-3)}
/* 文档 */
.doc{max-width:760px;margin:0 auto;padding:38px 48px 90px}
.doc h1{font-size:25px;margin-bottom:6px}
.doc .m{font-size:12px;color:var(--text-3);margin-bottom:24px}
.doc p{font-size:14.5px;line-height:1.95;color:var(--text-2);margin-bottom:14px}
.doc blockquote{border-left:3px solid var(--teal);padding:4px 16px;color:var(--text-3);margin:14px 0;font-size:13.5px}
/* 模板弹层 */
.modal{position:fixed;inset:0;background:rgba(20,20,15,.4);display:none;align-items:center;justify-content:center;z-index:40}
.modal.show{display:flex}
.mbox{background:var(--panel);border-radius:var(--radius-lg);padding:26px;width:620px;box-shadow:var(--shadow)}
.mbox h3{font-size:16px;margin-bottom:4px}
.mbox .d{font-size:12.5px;color:var(--text-3);margin-bottom:16px}
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tpl{border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;text-align:center;font-size:13px}
.tpl:hover,.tpl.on{border-color:var(--teal);background:#f2fbf7}
.tpl .e{font-size:26px;margin-bottom:8px}
.mbox .ops{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.mbox .ops button{padding:7px 18px;border-radius:999px;font-size:13px;border:1px solid var(--border-strong)}
.mbox .ops .ok{background:var(--teal);border-color:var(--teal);color:#fff}
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:var(--text);color:#fff;font-size:13px;padding:9px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:.94}
.mock-note{position:fixed;right:14px;bottom:10px;font-size:10.5px;color:var(--text-3);z-index:70}
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">语雀 · 风格原型</span>
  <div class="urlbar" id="urlbar"></div>
  <span class="hint">两级分层：库列表 ⇄ 库内目录 · 交互可点</span>
</div>
<div class="layout">
  <aside class="sidebar">
    <div class="side-top">
      <button class="back" id="backBtn">← 返回知识库列表</button>
      <span class="ttl" id="sideTtl">知识库</span>
      <button class="act" id="newKb" title="新建知识库" style="font-size:16px">＋</button>
    </div>
    <div class="side-body" id="sideBody"></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="modal" id="modal"><div class="mbox">
  <h3>新建知识库</h3><div class="d">语雀风格：按场景选择起点（模拟）</div>
  <div class="tpls" id="tpls"></div>
  <div class="ops"><button onclick="closeModal()">取消</button><button class="ok" onclick="createKb()">创建</button></div>
</div></div>
<div class="toast" id="toast"></div>
<div class="mock-note">模拟行为，细节为合理推测 · 数据与其他风格原型一致</div>
<script>
const K=(id,name,desc,color,children)=>({id,name,desc,color,children});
const F=(id,name,children)=>({id,name,children});
const N=(id,name,ts,body)=>({id,name,ts,body});
const DATA=[
 K("kb-app","实际应用","产品部署、上线与日常运维的经验沉淀。","linear-gradient(135deg,#5b8def,#3f6bd8)",[
   F("f-build","编译产物",[N("n1","产物命名规范","10-27","<p>所有构建产物按 <b>模块-版本-哈希</b> 命名，禁止手工改名。</p><blockquote>例：baseforge-web-1.4.2-8ac31f.tar.gz</blockquote>"),N("n2","清理策略","10-26","<p>保留最近 20 个版本，每日凌晨自动清理。</p>")]),
   F("f-deploy","部署",[N("n3","上线检查清单","10-27","<p>上线前逐项确认：迁移、灰度、监控。</p>"),N("n4","回滚手册","10-25","<p>先回代码再回数据，双人复核。</p>")]),
   F("f-req","需求池",[N("n5","10 月需求评审结论","10-24","<p>知识库交互重构：单树 + 库详情页。</p>")])]),
 K("kb-work","工作笔记","个人日常记录与周报。","linear-gradient(135deg,#59c39a,#2f9e77)",[
   N("n6","周报 1028","10-28","<p>本周：知识库重构调研完成。</p>"),N("n7","1:1 记录","10-21","<p>与设计对齐详情页信息架构。</p>")]),
 K("kb-design","设计","视觉与交互规范。","linear-gradient(135deg,#e8a33d,#d98a2b)",[
   F("f-ds","组件规范",[N("n8","按钮层级","10-20","<p>主按钮每屏最多一个。</p>")]),
   N("n9","色彩 tokens","10-19","<p>语义色一律走 token。</p>")]),
 K("kb-empty","空库演示","",  "linear-gradient(135deg,#b0b0aa,#8f8d83)",[]),
];
const cnt=n=>n.children?n.children.reduce((s,c)=>s+cnt(c),0):1;
const st={mode:"list",kb:null,exp:new Set(["kb-app","f-deploy"]),sel:null,sort:"upd"};
const $=s=>document.querySelector(s);
const side=$("#sideBody"),main=$("#main"),urlbar=$("#urlbar"),toastEl=$("#toast");
let tt; const toast=m=>{toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove("show"),1800)};
function renderUrl(){ urlbar.innerHTML = st.mode==="list"
  ? `<span>yuque.com/<b>:login</b>/workspace</span>`
  : `yuque.com/<b>:login</b>/${st.kb.id.replace("kb-","")} <span style="color:var(--text-3)">${st.sel&&st.sel.startsWith("n")?"/:"+st.sel:""}</span>`; }
function renderSide(){
  $("#backBtn").classList.toggle("show",st.mode==="tree");
  $("#sideTtl").textContent = st.mode==="list" ? "知识库" : st.kb.name;
  if(st.mode==="list"){
    const list=[...DATA].sort((a,b)=>st.sort==="name"?a.name.localeCompare(b.name):0);
    side.innerHTML=`<div class="sort-row">排序 <button data-s="upd" class="${st.sort==="upd"?"on":""}">最近更新</button><button data-s="name" class="${st.sort==="name"?"on":""}">名称</button></div>`
      + list.map(k=>`<div class="kb-item" data-kb="${k.id}"><div class="bk" style="background:${k.color}">📗</div>
        <div><h4>${k.name}</h4><p>${k.desc||"（暂无简介）"}</p><div class="meta">${cnt(k)} 篇 · 最近更新 ${lastTs(k)||"—"}</div></div></div>`).join("");
    side.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{st.sort=b.dataset.s;renderSide()});
    side.querySelectorAll("[data-kb]").forEach(el=>el.onclick=()=>enterKb(el.dataset.kb));
  } else {
    side.innerHTML=`<div class="sec-label">目录 · ${cnt(st.kb)} 篇</div>`+treeHtml(st.kb.children||"",0);
    side.querySelectorAll("[data-tw]").forEach(b=>b.onclick=e=>{e.stopPropagation();const i=b.dataset.tw;st.exp.has(i)?st.exp.delete(i):st.exp.add(i);renderSide()});
    side.querySelectorAll("[data-doc]").forEach(el=>el.onclick=()=>openDoc(el.dataset.doc));
    side.querySelectorAll("[data-fold]").forEach(el=>el.onclick=()=>{st.exp.has(el.dataset.fold)?st.exp.delete(el.dataset.fold):st.exp.add(el.dataset.fold);renderSide()});
  }
  renderUrl();
}
function lastTs(k){let m=null;const w=n=>{if(n.ts&&(!m||n.ts>m))m=n.ts;(n.children||[]).forEach(w)};w(k);return m}
function treeHtml(list,d){return (list||[]).map(n=>{
  const isF=!!n.children, open=st.exp.has(n.id);
  return `<div class="row" style="margin-left:${d*16}px">
    ${isF?`<button class="tw ${open?"open":""}" data-tw="${n.id}">▶</button>`:`<span class="tw ghost">▶</span>`}
    <span class="ico">${isF?"📁":"📄"}</span>
    <span class="name" ${isF?`data-fold="${n.id}"`:`data-doc="${n.id}"`}>${n.name}</span>
    ${isF?`<span style="font-size:11px;color:var(--text-3)">${cnt(n)}</span>`:`<span style="font-size:11px;color:var(--text-3)">${n.ts}</span>`}
    <span class="drag">⠿</span></div>`
    +(isF&&open?treeHtml(n.children,d+1):"");}).join("")}
function enterKb(id){st.kb=DATA.find(k=>k.id===id);st.mode="tree";st.exp.add(id);st.sel=null;renderSide();renderMain()}
$("#backBtn").onclick=()=>{st.mode="list";st.kb=null;st.sel=null;renderSide();renderMain()};
function renderMain(){
  if(st.mode==="list"){ main.innerHTML=`<div class="kb-home"><div style="padding:90px 40px;text-align:center;color:var(--text-3)"><h2 style="font-size:20px;color:var(--text-2);margin-bottom:10px">选择一本「知识库」</h2><p style="font-size:13.5px;line-height:1.9">语雀把每个库当成一本书：<br>侧栏先列书，点进去后侧栏变成这本书的目录，主区是书页（库首页）。</p></div></div>`; return; }
  if(!st.sel) return renderKbHome();
  const doc=findDoc(st.kb,st.sel); renderDoc(doc);
}
function findDoc(k,id){let r=null;const w=l=>(l||[]).forEach(n=>{if(n.id===id)r=n;w(n.children)});w(k.children);return r}
function renderKbHome(){
  const k=st.kb, empty=cnt(k)===0;
  main.innerHTML=`<div class="kb-home">
    <div class="cover" style="background:${k.color}">${k.name}</div>
    <div class="body">
      <div class="kb-meta" style="display:flex"><span class="avatar">wz</span><span>@wushuzhilu 等 3 人参与编写</span>
        <div class="yq-actions"><button onclick="toast('收藏（模拟）')">☆ 收藏</button><button onclick="toast('分享（模拟）')">分享</button><button class="pri" onclick="toast('新建文档（模拟）')">＋ 新建文档</button></div></div>
      <div class="kb-desc">📌 ${k.desc||"暂无简介"}</div>
      ${empty?`<div style="margin-top:60px;text-align:center;padding:50px;border:1.5px dashed var(--border-strong);border-radius:var(--radius);background:var(--panel)">
        <div style="font-size:32px">📖</div><h3 style="margin:10px 0 6px;font-size:15px;color:var(--text-2)">这本书还是空的</h3>
        <p style="font-size:12.5px;color:var(--text-3);margin-bottom:16px">语雀风格：套用模板或新建第一篇</p>
        <button style="background:var(--teal);color:#fff;border-radius:999px;padding:8px 20px" onclick="toast('新建文档（模拟）')">＋ 新建第一篇</button></div>`
      :`<div class="toc-h"><h3>目录</h3><span>语雀目录 3.0 · 全可视化编排</span></div>`+tocHtml(k.children||"",1)+""}
    </div></div>`;
  main.querySelectorAll("[data-doc]").forEach(el=>el.onclick=()=>openDoc(el.dataset.doc));
  main.querySelectorAll("[data-fold]").forEach(el=>el.onclick=()=>{st.exp.has(el.dataset.fold)?st.exp.delete(el.dataset.fold):st.exp.add(el.dataset.fold);renderSide();renderMain()});
}
function tocHtml(list,no){return (list||[]).map(n=>{
  const isF=!!n.children,my=no++;
  return `<div class="tr" ${isF?`data-fold="${n.id}"`:`data-doc="${n.id}"`}><span class="n">${my}.</span>
    ${isF?`<span class="tw ${st.exp.has(n.id)?"open":""}" data-tw2 style="font-size:10px;color:var(--text-3)">▶</span>`:""}
    ${isF?`<span>📁</span>`:`<span>📄</span>`}<span class="nm">${n.name}</span>
    <span class="cnt">${isF?cnt(n)+" 篇":n.ts}</span></div>`+(isF&&st.exp.has(n.id)?tocHtml(n.children,no):"");}).join("")}
function openDoc(id){st.sel=id;renderSide();renderDoc(findDoc(st.kb,id))}
function renderDoc(d){
  main.innerHTML=`<div class="doc"><h1>${d.name}</h1><div class="m">@wushuzhilu · 编辑于 ${d.ts}</div>${d.body}</div>`;
  renderUrl();
}
/* 模板弹层 */
const TPLS=[{e:"📗",n:"空白知识库",d:"从零开始"},{e:"📘",n:"团队文档",d:"常见协作结构"},{e:"📙",n:"项目空间",d:"需求/开发/上线"}];
let tplSel=0;
$("#tpls").innerHTML=TPLS.map((t,i)=>`<div class="tpl ${i===0?"on":""}" data-i="${i}"><div class="e">${t.e}</div><b>${t.n}</b><div style="font-size:11px;color:var(--text-3);margin-top:4px">${t.d}</div></div>`).join("");
$("#tpls").querySelectorAll(".tpl").forEach(el=>el.onclick=()=>{tplSel=+el.dataset.i;$("#tpls").querySelectorAll(".tpl").forEach(x=>x.classList.toggle("on",+x.dataset.i===tplSel))});
$("#newKb").onclick=()=>$("#modal").classList.add("show");
function closeModal(){$("#modal").classList.remove("show")}
function createKb(){
  const name=TPLS[tplSel].n+" "+(DATA.length+1);
  DATA.push(K("kb-new"+DATA.length,name,TPLS[tplSel].d,"linear-gradient(135deg,#9aa7ff,#6f7fe8)",[]));
  st.mode="list";renderSide();closeModal();toast("已创建，回到列表（语雀：列表态创建，点进去才开始编排）");
}
renderSide();renderMain();
</script>
</body>
</html>
