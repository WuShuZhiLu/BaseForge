<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 · 知识库单树 + 库详情页（DESIGN-KB-SINGLE-TREE）</title>
<style>
:root{
  --bg:#f6f6f4; --panel:#ffffff; --border:#e4e4e0; --border-strong:#d4d4cf;
  --text:#26251f; --text-2:#5c5a52; --text-3:#8f8d83;
  --brand:#2f6f4f; --brand-soft:#e8f1ea; --brand-soft-2:#d8e8dd;
  --amber:#e8a33d; --amber-soft:#fdf3e3;
  --danger:#c2453a;
  --radius:8px; --radius-lg:12px;
  --shadow:0 1px 2px rgba(30,30,20,.05),0 4px 16px rgba(30,30,20,.06);
  font-size:15px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.topbar{height:46px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border)}
.topbar .logo{font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--brand)}
.urlbar{flex:1;max-width:560px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:5px 14px;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--text-2)}
.urlbar .seg{transition:color .15s,background .15s;border-radius:6px;padding:1px 6px}
.urlbar .seg.on{color:var(--brand);background:var(--brand-soft);font-weight:600}
.urlbar .seg.off{color:var(--text-3)}
.topbar .hint{margin-left:auto;font-size:12px;color:var(--text-3)}
.layout{display:flex;height:calc(100vh - 46px)}
/* ================= 侧栏 ================= */
.sidebar{width:300px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.side-head{padding:14px 14px 8px}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:7px 12px;color:var(--text-3);font-size:13px}
.search input{border:none;outline:none;background:none;flex:1;font:inherit;color:var(--text)}
.kb-head{display:flex;align-items:center;padding:10px 14px 6px;font-size:12px;letter-spacing:.1em;color:var(--text-3)}
.kb-head .cnt{margin-left:6px;letter-spacing:0}
.kb-head .add{margin-left:auto;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:15px}
.kb-head .add:hover{background:var(--brand-soft);color:var(--brand)}
.tree{flex:1;overflow-y:auto;padding:0 8px 20px}
.row{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;border-radius:var(--radius);cursor:pointer;color:var(--text-2);position:relative;user-select:none}
.row:hover{background:var(--bg)}
.row.selected{background:var(--brand-soft);color:var(--text);font-weight:500}
.row .twist{width:16px;height:16px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:10px;transition:transform .15s;border-radius:4px}
.row .twist:hover{background:var(--border);color:var(--text)}
.row .twist.open{transform:rotate(90deg)}
.row .twist.ghost{visibility:hidden}
.row .ico{flex:none;font-size:14px;width:18px;text-align:center}
.row.kb > .ico{color:var(--amber)}
.row.folder > .ico{color:var(--amber)}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.kb > .name{font-weight:600;color:var(--text)}
.row .rc{flex:none;font-size:11px;color:var(--text-3)}
.row .acts{display:none;gap:2px}
.row:hover .acts,.row.selected .acts{display:flex}
.row .acts button{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-3)}
.row .acts button:hover{background:var(--brand-soft);color:var(--brand)}
.row.empty-kb > .name{color:var(--text-3);font-weight:400}
.children{overflow:hidden}
.children.hidden{display:none}
.legend{border-top:1px solid var(--border);padding:10px 14px;font-size:11px;line-height:1.9;color:var(--text-3)}
.legend b{color:var(--text-2);font-weight:600}
/* ================= 主区 ================= */
.main{flex:1;min-width:0;overflow-y:auto;background:var(--bg)}
.view-home{max-width:760px;margin:0 auto;padding:80px 40px;text-align:center;color:var(--text-3)}
.view-home h2{color:var(--text-2);font-size:20px;margin-bottom:10px}
.view-home p{font-size:13.5px;line-height:1.8}
/* --- 库详情页 --- */
.kb-detail{max-width:860px;margin:0 auto;padding:44px 48px 80px}
.kd-head{display:flex;align-items:flex-start;gap:18px}
.kd-icon{width:58px;height:58px;flex:none;border-radius:14px;background:linear-gradient(135deg,var(--amber-soft),#f7e3bd);display:flex;align-items:center;justify-content:center;font-size:28px}
.kd-title h1{font-size:24px;font-weight:700;display:flex;align-items:center;gap:8px}
.kd-title .lock{font-size:13px;color:var(--text-3)}
.kd-stats{margin-top:7px;font-size:12.5px;color:var(--text-3)}
.kd-stats b{color:var(--text-2);font-weight:600}
.kd-actions{margin-left:auto;display:flex;gap:8px}
.kd-actions button{border:1px solid var(--border-strong);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:12.5px;color:var(--text-2)}
.kd-actions button:hover{border-color:var(--brand);color:var(--brand)}
.kd-actions button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.kd-actions button.primary:hover{opacity:.9;color:#fff}
.kd-desc{margin-top:22px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 18px;font-size:13.5px;color:var(--text-2);display:flex;gap:10px;align-items:flex-start}
.kd-toc-head{display:flex;align-items:baseline;margin:30px 0 4px}
.kd-toc-head h3{font-size:13px;letter-spacing:.12em;color:var(--text-3);font-weight:600}
.kd-toc-head span{margin-left:12px;font-size:11.5px;color:var(--text-3)}
.toc-row{display:flex;align-items:baseline;gap:10px;padding:9px 12px;border-radius:var(--radius);cursor:pointer;font-size:14px;color:var(--text-2)}
.toc-row:hover{background:var(--panel)}
.toc-row .t-ico{flex:none;width:18px;text-align:center}
.toc-row .t-name{flex:none;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc-row .t-name.folder{color:var(--text);font-weight:500}
.toc-row .dots{flex:1;border-bottom:1.5px dotted var(--border-strong);transform:translateY(-4px);min-width:24px}
.toc-row .ts{flex:none;font-size:12px;color:var(--text-3)}
.toc-row.lvl2{padding-left:44px}
.toc-row.lvl3{padding-left:76px}
.kd-empty{margin-top:60px;text-align:center;padding:56px 20px;border:1.5px dashed var(--border-strong);border-radius:var(--radius-lg);background:var(--panel)}
.kd-empty .big{font-size:34px}
.kd-empty h3{margin:12px 0 6px;font-size:16px;color:var(--text-2)}
.kd-empty p{font-size:13px;color:var(--text-3);margin-bottom:18px}
.kd-empty button{background:var(--brand);color:#fff;border-radius:999px;padding:9px 22px;font-size:13.5px}
.kd-empty button:hover{opacity:.9}
/* --- 文档编辑器 --- */
.crumb{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:12px 48px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);font-size:12.5px;color:var(--text-3)}
.crumb .c{cursor:pointer;border-radius:6px;padding:2px 6px}
.crumb .c:hover{background:var(--brand-soft);color:var(--brand)}
.crumb .c.here{color:var(--text);font-weight:600;cursor:default}
.crumb .c.here:hover{background:none}
.crumb .sep{color:var(--border-strong)}
.editor{max-width:760px;margin:0 auto;padding:40px 48px 90px}
.editor h1{font-size:26px;margin-bottom:8px}
.editor .meta{font-size:12px;color:var(--text-3);margin-bottom:26px}
.editor p{font-size:14.5px;line-height:1.95;color:var(--text-2);margin-bottom:14px}
.editor h2{font-size:17px;margin:26px 0 10px;color:var(--text)}
.editor blockquote{border-left:3px solid var(--brand-soft-2);padding:4px 16px;color:var(--text-3);font-size:13.5px;margin:16px 0}
/* --- 右键菜单 --- */
.ctx{position:fixed;z-index:50;min-width:168px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:5px;display:none}
.ctx.show{display:block}
.ctx button{display:flex;width:100%;align-items:center;gap:10px;padding:7px 12px;border-radius:6px;font-size:13px;color:var(--text-2);text-align:left}
.ctx button:hover{background:var(--brand-soft);color:var(--brand)}
.ctx button.danger{color:var(--danger)}
.ctx button.danger:hover{background:#fbeae8;color:var(--danger)}
.ctx .sep{height:1px;background:var(--border);margin:5px 8px}
/* --- toast --- */
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);background:var(--text);color:#fff;font-size:13px;padding:9px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:.94;transform:translateX(-50%)}
kbd{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:10.5px;background:var(--bg);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--text-2)}
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">BaseForge</span>
  <div class="urlbar" id="urlbar" title="URL 即状态：每次交互真实变化"></div>
  <span class="hint">交互原型 · 供评审，<kbd>右键</kbd>树行试试</span>
</div>

<div class="layout">
  <aside class="sidebar">
    <div class="side-head">
      <div class="search">🔍<input id="search" placeholder="搜索知识库、文件夹、文档…"></div>
    </div>
    <div class="kb-head"><span>知识库</span><span class="cnt" id="kbCount"></span><button class="add" id="addKb" title="新建知识库">＋</button></div>
    <div class="tree" id="tree"></div>
    <div class="legend">
      <b>单击</b> 库根=详情页 · 文件夹=展开/折叠 · 文档=打开<br>
      <b>双击/箭头</b>=展开折叠 · <b>右键</b>=节点菜单 · <b>＋</b>=按上下文新建<br>
      树恒为一棵，无「进入库」的渲染切换 —— 空库也留在树里
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="ctx" id="ctx"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ 数据（与设计文档示例一致） ============ */
let uid = 100;
const K = (id,name,desc,children,fav=false)=>({type:"kb",id,name,desc,children,fav});
const F = (id,name,children)=>({type:"folder",id,name,children});
const N = (id,name,ts,body)=>({type:"doc",id,name,ts,body});
const DATA = [
  K("kb-app","实际应用","产品部署、上线与日常运维的经验沉淀。",[10,1099,3],
    [ F("f-build","编译产物",[
        N("n-build-1","产物命名规范","10-27 18:22","<p>所有构建产物按 <b>模块-版本-哈希</b> 三段式命名，禁止手工改名。</p><blockquote>例：baseforge-web-1.4.2-8ac31f.tar.gz</blockquote><h2>为什么</h2><p>回滚时可以直接从哈希定位到当次提交，避免「同名不同物」。</p>"),
        N("n-build-2","清理策略","10-26 11:02","<p>保留最近 20 个版本，每日凌晨任务自动清理。</p>")
      ]),
      F("f-deploy","部署",[
        N("n-deploy-1","上线检查清单","10-27 18:22","<p>上线前逐项确认：</p><p>① 迁移脚本在预发执行过<br>② 灰度比例与预案<br>③ 监控大盘与告警阈值</p>"),
        N("n-deploy-2","回滚手册","10-25 09:41","<p>先回代码，再回数据；数据回滚必须双人复核。</p>")
      ]),
      F("f-req","需求池",[
        N("n-req-1","10 月需求评审结论","10-24 15:40","<p>知识库交互重构定稿：单树 + 库详情页。</p>")
      ])
    ]),
  K("kb-work","工作笔记","个人日常记录与周报。",[7,520,1],
    [ N("n-w1","周报 1028","10-28 10:15","<p>本周：知识库重构调研完成，两派结论已输出。</p>"),
      N("n-w2","1:1 记录","10-21 16:30","<p>与设计对齐详情页信息架构。</p>")
    ]),
  K("kb-design","设计","视觉与交互规范。",[8,760,1],
    [ F("f-ds","组件规范",[ N("n-ds-1","按钮层级","10-20 14:00","<p>主按钮每屏最多一个。</p>") ]),
      N("n-ds-2","色彩 tokens","10-19 09:20","<p>语义色一律走 token，禁止裸值。</p>")
    ]),
  K("kb-empty","空库演示",null,[],false),
];
/* 时间戳汇总：文件夹 = 子孙最大 ts */
function maxTs(n){ if(n.type==="doc") return n.ts; let m=null; (n.children||[]).forEach(c=>{const t=maxTs(c); if(t&&(!m||t>m)) m=t;}); return m; }
function countDocs(n){ if(n.type==="doc") return 1; return (n.children||[]).reduce((s,c)=>s+countDocs(c),0); }
function findNode(id, list=DATA, parent=null, depth=0){ for(const n of list){ if(n.id===id) return {node:n,parent,depth}; const f=findNode(id,n.children||[],n,depth+1); if(f) return f; } return null; }

/* ============ 状态 ============ */
const state = {
  expanded: new Set(["kb-app","f-deploy","kb-work"]),
  selected: null,
  view: {kind:"home"},            // home | detail | doc
  search: "",
  kbIds: new Set(DATA.map(d=>d.id)),
};
const $ = s=>document.querySelector(s);
const tree = $("#tree"), main = $("#main"), urlbar = $("#urlbar"), ctxEl = $("#ctx"), toastEl = $("#toast");

/* ============ URL ============ */
function renderUrl(){
  let html = `<span class="seg ${state.view.kind==="home"?"on":"off"}">/kb/space</span>`;
  if(state.view.kind!=="home"){
    const kb = state.view.kbId;
    html += ` / <span class="seg ${state.view.kind==="detail"?"on":"off"}">:kbId(${kb})</span>`;
    if(state.view.kind==="doc") html += ` / <span class="seg on">notes/:noteId(${state.view.noteId})</span>`;
  }
  urlbar.innerHTML = html;
}

/* ============ 侧栏树 ============ */
function visible(list){ return list.filter(n=>!state.search || n.name.toLowerCase().includes(state.search)); }
function rowHtml(n, depth, parentKb){
  const f = findNode(n.id);
  const sel = state.selected===n.id ? " selected":"";
  const isKb=n.type==="kb", isF=n.type==="folder", isDoc=n.type==="doc";
  const hasCh = (n.children||[]).length>0 || (isKb && n.id==="kb-empty");
  const open = state.expanded.has(n.id);
  const twist = hasCh?`<button class="twist ${open?"open":""}" data-twist="${n.id}">▶</button>`:`<span class="twist ghost"></span>`;
  const ico = isKb?"📘":isF?"📁":"📄";
  const rc = isDoc?`<span class="rc">${n.ts}</span>`:`<span class="rc">${countDocs(n)}</span>`;
  const acts = `<span class="acts">
      ${isDoc?"":`<button data-add="${n.id}" title="新建">＋</button>`}
      <button data-menu="${n.id}" title="更多">⋯</button></span>`;
  const cls = isKb?(n.children.length? "kb":"kb empty-kb"):isF?"folder":"doc";
  return `<div class="row ${cls}${sel}" data-id="${n.id}" data-depth="${depth}" style="margin-left:${depth*18}px"
      ondblclick="toggleNode('${n.id}')" oncontextmenu="openCtx(event,'${n.id}')">
      ${twist}<span class="ico">${ico}</span><span class="name">${n.name}</span>${rc}${acts}</div>`;
}
function renderTree(){
  const frag = [];
  const walk=(list,depth,parentKb)=>{
    for(const n of visible(list)){
      frag.push(rowHtml(n,depth,parentKb));
      if((n.children||[]).length && state.expanded.has(n.id) && depth<4){
        frag.push(`<div class="children">`); walk(n.children,depth+1,n.type==="kb"?n.id:parentKb); frag.push(`</div>`);
      }
    }
  };
  walk(DATA,0,null);
  tree.innerHTML = frag.join("");
  $("#kbCount").textContent = DATA.length;
}
tree.addEventListener("click",e=>{
  const t=e.target.closest("[data-twist]"); if(t){ e.stopPropagation(); toggleNode(t.dataset.twist); return; }
  const a=e.target.closest("[data-add]"); if(a){ e.stopPropagation(); openAdd(a.dataset.add); return; }
  const m=e.target.closest("[data-menu]"); if(m){ e.stopPropagation(); openCtx({preventDefault(){},clientX:e.clientX,clientY:e.clientY},m.dataset.menu); return; }
  const r=e.target.closest(".row"); if(r) selectNode(r.dataset.id);
});
$("#search").addEventListener("input",e=>{ state.search=e.target.value.trim().toLowerCase(); renderTree(); });
$("#addKb").addEventListener("click",()=>{
  const kb=K("kb-new-"+(++uid),"新建知识库",null,[],false);
  DATA.push(kb); state.expanded.add(kb.id);
  renderTree(); toast("已创建（原型：直接落一个空库，停在树里，不弹回）");
  selectNode(kb.id);
});

/* ============ 交互语义（设计文档 §1） ============ */
function toggleNode(id){ state.expanded.has(id)?state.expanded.delete(id):state.expanded.add(id); renderTree(); }
function selectNode(id){
  const f=findNode(id); if(!f) return;
  state.selected=id; const n=f.node;
  if(n.type==="kb"){ state.view={kind:"detail",kbId:n.id}; }
  else if(n.type==="doc"){ state.view={kind:"doc",kbId:nearestKb(f),noteId:n.id}; }
  else { toggleNode(id); renderTree(); renderMain(); renderUrl(); return; } // 文件夹：选中+折叠，主区不动
  renderTree(); renderMain(); renderUrl();
}
function nearestKb(f){ let p=f.parent; while(p&&p.type!=="kb") p=null; return p?p.id:"space"; }
function openDoc(id){
  const f=findNode(id); state.selected=id; state.view={kind:"doc",kbId:nearestKb(f),noteId:id};
  renderTree(); renderMain(); renderUrl();
}
function openDetail(kbId){ state.selected=kbId; state.view={kind:"detail",kbId:kbId}; renderTree(); renderMain(); renderUrl(); }
function openAdd(id){ toast("＋ 按上下文新建（原型演示）"); }

/* ============ 主区 ============ */
function renderMain(){
  const v=state.view;
  if(v.kind==="home"){ main.innerHTML=`<div class="view-home"><h2>选择一个知识库</h2><p>单击左侧 <b style="color:var(--amber)">📘 知识库根行</b> → 主区打开库详情页<br>单击 📄 文档 → 编辑器 + 面包屑 · 单击 📁 文件夹 → 展开/折叠</p></div>`; return; }
  if(v.kind==="detail") return renderDetail(findNode(v.kbId).node);
  renderDoc(findNode(v.noteId));
}
function renderDetail(kb){
  const docs=countDocs(kb), empty=docs===0;
  const words=(kb.children||[]).length?1099:0;
  const toc = empty?"":`<div class="kd-toc-head"><h3>目录</h3><span>点击直达 · 右侧为该节点及子孙最近更新</span></div>`+tocHtml(kb.children||[],0);
  main.innerHTML=`<div class="kb-detail">
    <div class="kd-head">
      <div class="kd-icon">📘</div>
      <div class="kd-title"><h1>${kb.name} <span class="lock">🔒 私密</span></h1>
        <div class="stats"><b>${docs}</b> 文档 · <b>${words}</b> 字 · 更新于 <b>${maxTs(kb)||"—"}</b> · @wushuzhilu 等 3 人参与编写</div></div>
      <div class="kd-actions"><button data-x="fav">☆ 收藏</button><button data-x="share">分享</button><button class="primary" data-x="newdoc">＋ 新建文档</button></div>
    </div>
    <div class="kd-desc">📌 <span>${kb.desc||"暂无简介（notebooks.description，本期只读）"}</span></div>
    ${empty?`<div class="kd-empty"><div class="big">🗂️</div><h3>这个知识库还没有内容</h3><p>它是树里的普通一员 —— 不会弹回、不会消失</p><button data-x="newdoc">＋ 新建第一篇文档</button></div>`:toc}
  </div>`;
  main.querySelectorAll(".toc-row[data-doc]").forEach(r=>r.onclick=()=>openDoc(r.dataset.doc));
  main.querySelectorAll(".toc-row[data-folder]").forEach(r=>r.onclick=()=>{ state.expanded.add(r.dataset.folder); state.selected=r.dataset.folder; renderTree(); toast("已展开并选中（主区保持详情页）"); });
  main.querySelectorAll("[data-x=newdoc]").forEach(b=>b.onclick=()=>newDoc(kb));
  main.querySelectorAll("[data-x]").forEach(b=>{ if(b.dataset.x!=="newdoc") b.onclick=()=>toast(b.textContent.trim()+"（原型演示）"); });
}
function tocHtml(list,lv){
  return list.map(n=>{
    const ico=n.type==="folder"?"📁":n.type==="kb"?"📘":"📄";
    const row=`<div class="toc-row lvl${lv}" ${n.type==="doc"?`data-doc="${n.id}"`:`data-folder="${n.id}"`}>
      <span class="t-ico">${ico}</span><span class="t-name ${n.type==="folder"?"folder":""}">${n.name}</span>
      <span class="dots"></span><span class="ts">${maxTs(n)||countDocs(n)?"—":"—"}</span></div>`;
    return row+((n.children||[]).length&&state.expanded.has(n.id)&&lv<2?tocHtml(n.children,lv+1):"");
  }).join("");
}
function newDoc(kb){
  const d=N("n-new-"+(++uid),"未命名文档","刚刚","<p>开始输入…（原型：新建后直接打开编辑器）</p>");
  kb.children.push(d); state.expanded.add(kb.id);
  renderTree(); openDoc(d.id);
}
function renderDoc(n){
  const f=findNode(n.id); const chain=[]; let p=f.parent; while(p){ chain.unshift(p); p=null; }
  const kb=findNode(state.view.kbId);
  main.innerHTML=`<div class="crumb">
      <span class="c" data-go="detail">📘 ${kb?kb.node.name:"space"}</span><span class="sep">›</span>
      <span class="c here">${n.name}</span>
      <span style="margin-left:auto">更新于 ${n.ts||"刚刚"}</span></div>
    <div class="editor"><h1>${n.name}</h1><div class="meta">@wushuzhilu · 编辑于 ${n.ts||"刚刚"}</div>${n.body||"<p>（空文档）</p>"}</div>`;
  main.querySelector('[data-go="detail"]').onclick=()=>openDetail(state.view.kbId);
}

/* ============ 右键菜单 ============ */
let ctxFor=null;
function openCtx(e,id){
  e.preventDefault(); e.stopPropagation();
  ctxFor=id; const f=findNode(id); if(!f) return;
  const isDoc=f.node.type==="doc";
  ctxEl.innerHTML=`
    ${isDoc?"":`<button data-c="newdoc">📄 新建文档</button><button data-c="newfolder">📁 新建文件夹</button><div class="sep"></div>`}
    <button data-c="rename">✏️ 重命名</button>
    <button data-c="fav">⭐ 收藏</button>
    <button data-c="copy">🔗 复制链接（${id}）</button>
    <div class="sep"></div><button data-c="del" class="danger">🗑️ 删除</button>`;
  ctxEl.classList.add("show");
  const x=Math.min(e.clientX,innerWidth-190), y=Math.min(e.clientY,innerHeight-260);
  ctxEl.style.left=x+"px"; ctxEl.style.top=y+"px";
}
ctxEl.addEventListener("click",e=>{
  const b=e.target.closest("[data-c]"); if(!b) return;
  const c=b.dataset.c;
  if(c==="newdoc"){ const f=findNode(ctxFor); const kb=f.node.type==="kb"?f.node:nearestRoot(f); if(kb){ newDoc(kb); } }
  else if(c==="newfolder"){ toast("新建文件夹（原型演示）"); }
  else if(c==="copy"){ toast("已复制深链 /kb/space/"+(state.view.kbId||ctxFor)+"（原型演示）"); }
  else toast({rename:"重命名",fav:"收藏",del:"删除"}[c]+"（原型演示）");
  ctxEl.classList.remove("show");
});
function nearestRoot(f){ let n=f.node; while(n&&n.type!=="kb"){ const ff=findNode(n.id); n=ff&&ff.parent; } return n; }
document.addEventListener("click",e=>{ if(!e.target.closest(".ctx")) ctxEl.classList.remove("show"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") ctxEl.classList.remove("show"); });
let tt; function toast(m){ toastEl.textContent=m; toastEl.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>toastEl.classList.remove("show"),1800); }

/* ============ init ============ */
renderTree(); renderMain(); renderUrl();
</script>
