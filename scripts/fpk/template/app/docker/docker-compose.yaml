services:
  baseforge:
    image: {{DOCKERHUB_REPO}}:{{IMAGE_TAG}}
    container_name: baseforge
    restart: unless-stopped
    ports:
      - "3501:3001"
    volumes:
      - "/var/apps/baseforge/shares/baseforge/data:/app/data"
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/baseforge.db
      - PORT=3001
