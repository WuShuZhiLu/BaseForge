# 0.1 不含 Docker 在线升级（updater）；后端代码与 docs/docker-online-update.md 保留，后续版本再启用。
services:
  baseforge:
    # 镜像来自内部镜像仓库；上游来源在 README 与 Dockerfile 的归属说明中保留
    image: ${BASEFORGE_IMAGE_REPOSITORY:-registry.betheone.cc.cd/baseforge}:${BASEFORGE_IMAGE_TAG:-latest}
    container_name: baseforge
    restart: unless-stopped
    ports:
      - "${BASEFORGE_PORT:-3001}:3001"
    volumes:
      - baseforge-data:/app/data
      # 推荐把备份放到独立物理卷，并同时设置 BACKUP_DIR=/app/backups
      # - /path/on/another-disk/baseforge-backups:/app/backups
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/baseforge.db
      - PORT=3001
      - TZ=${TZ:-Asia/Shanghai}
      - PUBLIC_WEB_ORIGIN=${PUBLIC_WEB_ORIGIN:-}
      - BASEFORGE_DEPLOYMENT_TYPE=docker-compose-managed
      - BASEFORGE_IMAGE_TAG=${BASEFORGE_IMAGE_TAG:-latest}
      - BASEFORGE_IMAGE_REPOSITORY=${BASEFORGE_IMAGE_REPOSITORY:-registry.betheone.cc.cd/baseforge}
    labels:
      com.baseforge.managed: "true"
      com.baseforge.role: "app"
      com.baseforge.project: "baseforge"
      com.baseforge.instance: "${BASEFORGE_INSTANCE_ID:-baseforge}"
      com.baseforge.image-repository: "${BASEFORGE_IMAGE_REPOSITORY:-registry.betheone.cc.cd/baseforge}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const p=process.env.PORT||'3001';fetch('http://127.0.0.1:'+p+'/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - baseforge-network

volumes:
  baseforge-data:
    driver: local

networks:
  baseforge-network:
